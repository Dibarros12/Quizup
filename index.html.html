<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Quiz de Bar</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#020617}
    *{box-sizing:border-box}body{margin:0;background:#020617;color:#fff}button,input,select{font:inherit}
    button,select,input{border-radius:12px;border:1px solid #ffffff1a;background:#0f172a;color:#fff;padding:11px 14px}
    button{cursor:pointer}.btn{background:#c026d3;border:0;font-weight:800}.outline{background:transparent}.ghost{background:#ffffff0d}.danger{background:#dc2626;border:0}
    main{min-height:100vh;padding:24px}.wrap{max-width:1050px;margin:auto}.card{background:#ffffff10;border:1px solid #ffffff1a;border-radius:24px;padding:26px;box-shadow:0 18px 50px #0004}
    h1{font-size:clamp(2.2rem,8vw,4rem);margin:.2rem 0}.muted{color:#94a3b8}.cyan{color:#67e8f9}.amber{color:#fde68a}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.space>*+*{margin-top:18px}
    .panel{background:#0f172ab3;border-radius:18px;padding:16px}.team{border:1px solid #ffffff1a;border-radius:16px;padding:14px;background:#ffffff08}.active{border-color:#e879f9;background:#d946ef24}
    .cat{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #ffffff1a;border-radius:14px;background:#02061766}.cat.on{border-color:#e879f9;background:#d946ef22}
    .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.answer{text-align:left;padding:18px;font-weight:800;border:2px solid #ffffff1a}.answer.selected{border-color:white;background:#ffffff24}.answer.correct{border-color:#a7f3d0;background:#10b981}.answer.wrong{border-color:#fecaca;background:#ef4444}
    .fixed-game{position:fixed;inset:0;z-index:40;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#020617;padding:clamp(8px,1.4vh,16px)}
    .fixed-game .wrap{height:100%;max-width:min(1200px,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(6px,1vh,12px);overflow:hidden}
    .fixed-game .game-top{min-height:0}
    .fixed-game .scoreboard{margin:0!important;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:clamp(5px,.8vh,10px)}
    .fixed-game .team{padding:clamp(7px,1vh,11px);min-width:0}
    .fixed-game .quiz-card{min-height:0;height:100%;overflow:hidden;padding:clamp(12px,2vh,22px);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(7px,1.1vh,13px)}
    .fixed-game .quiz-card .panel{padding:clamp(8px,1.2vh,12px)}
    .fixed-game .question-title{font-size:clamp(1.25rem,3.3vh,2.4rem)!important;line-height:1.1;margin:0;overflow-wrap:anywhere}
    .fixed-game .answers{min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(6px,1vh,11px)}
    .fixed-game .answer{min-height:0;padding:clamp(8px,1.4vh,15px);font-size:clamp(.86rem,1.9vh,1.08rem);line-height:1.15;overflow-wrap:anywhere}
    .fixed-game .status{margin:0;padding:clamp(7px,1vh,11px);font-size:clamp(.78rem,1.7vh,.96rem)}
    .fixed-game .game-actions{margin-top:0!important}
    body.game-active{overflow:hidden;height:100vh;height:100dvh}
    body.game-active #app{height:100vh;height:100dvh;overflow:hidden}
    :fullscreen{overflow:hidden}
    :fullscreen .fixed-game{width:100vw;height:100vh;height:100dvh}
    @media(max-width:700px){.fixed-game .answers{grid-template-columns:1fr}.fixed-game .scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-height:720px){.fixed-game{padding:7px}.fixed-game .scoreboard{display:flex;overflow:hidden}.fixed-game .team{flex:1;padding:6px}.fixed-game .team small{display:none}.fixed-game .quiz-card{padding:10px}.fixed-game .question-title{font-size:clamp(1.05rem,3vh,1.7rem)!important}.fixed-game .answer{padding:7px}.fixed-game .panel{padding:7px}}.overlay{position:fixed;inset:0;background:#0009;z-index:60}.sidebar{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);z-index:70;background:#020617;border-left:1px solid #ffffff1a;padding:24px;overflow:auto}.close{font-size:24px}
    .status{padding:12px;border-radius:12px;background:#06b6d41c;color:#a5f3fc}.stat{text-align:center;padding:12px}.stat b{display:block;font-size:1.7rem}.hidden{display:none}.titlebar{position:relative;text-align:center}.bankbtn{position:absolute;right:0;top:0}
    @media(max-width:650px){main{padding:12px}.card{padding:18px}.bankbtn{position:static;margin-bottom:12px;width:100%}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE={used:'quizUsedV5',games:'quizGamesPlayedV3',bank:'quizCustomBankV1'};
const POINTS={'Fácil':1,'Médio':2,'Difícil':3};
const COUNTS=[5,10,15,20,30,50,75,100,150,200,300,500,1000];
const CLASSIC=['Cultura Geral','Cinema e Entretenimento','Ciência','Arte e Literatura','Desporto'];
const FACTS=[
['Geografia','Portugal','Lisboa'],['Geografia','Espanha','Madrid'],['Geografia','França','Paris'],['Geografia','Itália','Roma'],['Geografia','Alemanha','Berlim'],['Geografia','Canadá','Ottawa'],['Geografia','Brasil','Brasília'],['Geografia','Japão','Tóquio'],['Geografia','Austrália','Camberra'],['Geografia','Grécia','Atenas'],
['História','Revolução Francesa','1789'],['História','queda do Muro de Berlim','1989'],['História','primeiro rei de Portugal','D. Afonso Henriques'],['História','Batalha de Aljubarrota','1385'],['História','início da Primeira Guerra Mundial','1914'],['História','fim da Segunda Guerra Mundial na Europa','1945'],
['Portugal','Coimbra','Mondego'],['Portugal','Porto','Douro'],['Portugal','Lisboa','Tejo'],['Portugal','autor de Mensagem','Fernando Pessoa'],['Portugal','Prémio Nobel da Literatura de 1998','José Saramago'],['Portugal','data da Revolução dos Cravos','25 de abril de 1974'],
['Literatura','Os Lusíadas','Luís de Camões'],['Literatura','Dom Quixote','Miguel de Cervantes'],['Literatura','1984','George Orwell'],['Literatura','Frankenstein','Mary Shelley'],['Literatura','Os Maias','Eça de Queirós'],['Literatura','Romeu e Julieta','William Shakespeare'],
['Cinema e TV','Tubarão','Steven Spielberg'],['Cinema e TV','Pulp Fiction','Quentin Tarantino'],['Cinema e TV','Titanic','James Cameron'],['Cinema e TV','O Padrinho','Francis Ford Coppola'],['Cinema e TV','Interstellar','Christopher Nolan'],['Cinema e TV','Avatar','James Cameron'],
['Arte','Mona Lisa','Leonardo da Vinci'],['Arte','Guernica','Pablo Picasso'],['Arte','A Noite Estrelada','Vincent van Gogh'],['Arte','O Grito','Edvard Munch'],['Arte','O Beijo','Gustav Klimt'],['Arte','David','Miguel Ângelo'],
['Música','Abbey Road','The Beatles'],['Música','Thriller','Michael Jackson'],['Música','Nevermind','Nirvana'],['Música','21','Adele'],['Música','The Joshua Tree','U2'],['Música','Back in Black','AC/DC'],
['Ciência','ouro','Au'],['Ciência','prata','Ag'],['Ciência','ferro','Fe'],['Ciência','sódio','Na'],['Ciência','maior planeta do Sistema Solar','Júpiter'],['Ciência','planeta mais próximo do Sol','Mercúrio'],['Ciência','unidade SI de força','newton'],['Ciência','número de cromossomas humanos','46'],
['Natureza','maior mamífero do mundo','baleia-azul'],['Natureza','animal terrestre mais rápido','guepardo'],['Natureza','maior oceano','Pacífico'],['Natureza','maior floresta tropical','Amazónia'],['Natureza','árvore que produz bolotas','carvalho'],
['Desporto','Wimbledon','Ténis'],['Desporto','Ryder Cup','Golfe'],['Desporto','Tour de France','Ciclismo'],['Desporto','Super Bowl','Futebol americano'],['Desporto','Liga dos Campeões','Futebol'],['Desporto','Volta a Portugal','Ciclismo'],
['Gastronomia','guacamole','abacate'],['Gastronomia','hummus','grão-de-bico'],['Gastronomia','pesto genovês','manjericão'],['Gastronomia','paella','arroz'],['Gastronomia','sushi','arroz'],['Gastronomia','tahini','sésamo'],
['Tecnologia','PlayStation','Sony'],['Tecnologia','Android','Google'],['Tecnologia','Windows','Microsoft'],['Tecnologia','iPhone','Apple'],['Tecnologia','Xbox','Microsoft'],['Tecnologia','Photoshop','Adobe'],
['Cultura Geral','número de lados de um hexágono','6'],['Cultura Geral','moeda do Japão','iene'],['Cultura Geral','mistura de azul e amarelo','verde'],['Cultura Geral','instrumento que mede a temperatura','termómetro'],['Cultura Geral','número de anéis olímpicos','5'],
['Matemática e Lógica','raiz quadrada de 144','12'],['Matemática e Lógica','valor de 9 vezes 8','72'],['Matemática e Lógica','número romano X','10'],['Matemática e Lógica','metade de 3/4','3/8'],['Matemática e Lógica','100 dividido por 4','25']
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function classic(c){if(['Geografia','História','Natureza','Portugal','Gastronomia','Cultura Geral'].includes(c))return'Cultura Geral';if(['Cinema e TV','Música'].includes(c))return'Cinema e Entretenimento';if(['Ciência','Tecnologia','Matemática e Lógica'].includes(c))return'Ciência';if(['Arte','Literatura'].includes(c))return'Arte e Literatura';return'Desporto'}
function qtext(c,s){if(c==='Geografia')return`Qual é a capital de ${s}?`;if(c==='Literatura')return`Quem escreveu ${s}?`;if(c==='Cinema e TV')return`Quem realizou ${s}?`;if(c==='Arte')return`Quem criou ${s}?`;if(c==='Música')return`Quem lançou ${s}?`;if(c==='Gastronomia')return`Qual é o ingrediente principal de ${s}?`;if(c==='Tecnologia')return`Que empresa está associada a ${s}?`;if(c==='Matemática e Lógica')return`Qual é o resultado de: ${s}?`;return`Qual é a resposta correta para: ${s}?`}
function makeBank(){const grouped={};FACTS.forEach(f=>(grouped[f[0]]??=[]).push(f));return Array.from({length:1000},(_,i)=>{const fi=i%FACTS.length,r=Math.floor(i/FACTS.length),[category,subject,correct]=FACTS[fi],alts=grouped[category].map(x=>x[2]).filter(x=>x!==correct),n=alts.length>=3?4:Math.max(2,alts.length+1),ds=[];for(let o=0;o<alts.length&&ds.length<n-1;o++){let v=alts[(fi+r+o)%alts.length];if(v&&!ds.includes(v))ds.push(v)}let opts=[correct,...ds],rot=r%opts.length;opts=opts.map((_,j)=>opts[(j+rot)%opts.length]);return{id:`local-${i+1}`,category,difficulty:r%5<2?'Fácil':r%5<4?'Médio':'Difícil',question:r?qtext(category,subject):qtext(category,subject),options:opts,answer:opts.indexOf(correct),explanation:`${subject} relaciona-se corretamente com ${correct}.`}})}
const DEFAULT_BANK=makeBank();
function stored(k,f){try{let v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}
let state={screen:'home',teams:['Jogador 1'],count:20,difficulty:'Misto',cats:[...CLASSIC],seconds:30,auto:false,manual:true,paused:false,game:[],index:0,selected:null,revealed:false,active:0,scores:[0],used:stored(STORAGE.used,[]),games:Number(localStorage.getItem(STORAGE.games)||0),time:30,sidebar:false,status:'',bank:stored(STORAGE.bank,DEFAULT_BANK)};
let timer=null,autoTimer=null;const app=document.getElementById('app');
function saveBank(){localStorage.setItem(STORAGE.bank,JSON.stringify(state.bank))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filtered(){return state.bank.filter(q=>(state.difficulty==='Misto'||q.difficulty===state.difficulty)&&state.cats.includes(classic(q.category)))}
function counts(){let r={};CLASSIC.forEach(c=>r[c]=state.bank.filter(q=>(state.difficulty==='Misto'||q.difficulty===state.difficulty)&&classic(q.category)===c).length);return r}
function render(){clearTimeout(timer);clearTimeout(autoTimer);document.body.classList.toggle('game-active',state.screen==='game');if(state.screen==='home')home();else if(state.screen==='results')results();else game();}
function home(){const fs=filtered(),cc=counts(),ids=new Set(fs.map(x=>x.id)),used=state.used.filter(x=>ids.has(x)).length;app.innerHTML=`<main><div class="wrap"><div class="card space"><div class="titlebar"><button class="outline bankbtn" data-a="sidebar">Banco JSON</button><div class="amber" style="font-size:54px">🏆</div><h1>Quiz de Bar</h1><p class="muted">Banco atual: ${state.bank.length} perguntas.</p></div><section><div class="row between"><b>${state.teams.length===1?'Jogador':'Equipas'} (${state.teams.length}/8)</b><button class="outline" data-a="addteam">+ Adicionar equipa</button></div><div class="grid g2" style="margin-top:12px">${state.teams.map((t,i)=>`<div class="row"><input style="flex:1" value="${esc(t)}" data-team="${i}">${state.teams.length>1?`<button class="ghost" data-remove="${i}">×</button>`:''}</div>`).join('')}</div></section><div class="grid g3"><label>Perguntas<select data-f="count">${COUNTS.map(v=>`<option ${v===state.count?'selected':''}>${v}</option>`).join('')}</select></label><label>Dificuldade<select data-f="difficulty">${['Misto','Fácil','Médio','Difícil'].map(v=>`<option ${v===state.difficulty?'selected':''}>${v}</option>`).join('')}</select></label><label>Tempo<select data-f="seconds">${[15,20,30,45,60].map(v=>`<option value="${v}" ${v===state.seconds?'selected':''}>${v} segundos</option>`).join('')}</select></label></div><section class="panel"><div class="row between"><div><b>Bar Clássico (${state.cats.length}/5)</b><div class="muted">${fs.length} perguntas disponíveis</div></div><div class="row"><button class="ghost" data-a="allcats">Todas</button><button class="ghost" data-a="nocats">Limpar</button></div></div><div class="grid g3" style="margin-top:12px">${CLASSIC.map(c=>`<label class="cat ${state.cats.includes(c)?'on':''}"><span><input type="checkbox" data-cat="${esc(c)}" ${state.cats.includes(c)?'checked':''}> ${esc(c)}</span><b>${cc[c]}</b></label>`).join('')}</div></section><div class="panel grid g4"><div class="stat"><b>${fs.length}</b><span class="muted">Total filtrado</span></div><div class="stat"><b>${used}</b><span class="muted">Usadas</span></div><div class="stat"><b>${Math.max(0,fs.length-used)}</b><span class="muted">Disponíveis</span></div><div class="stat"><b>${state.games}</b><span class="muted">Partidas</span></div><button class="ghost" data-a="clear">Limpar histórico</button></div><div class="panel"><label><input type="checkbox" data-f="auto" ${state.auto?'checked':''}> Modo automático</label>${state.auto?`<label style="margin-left:18px"><input type="checkbox" data-f="manual" ${state.manual?'checked':''}> Permitir avanço manual</label>`:''}</div><div class="row"><button class="btn" style="flex:1" data-a="start" ${fs.length?'':'disabled'}>▶ Iniciar</button><button class="outline" data-a="full">⛶ Ecrã inteiro</button></div></div></div></main>${state.sidebar?sidebar():''}`;bind()}
function sidebar(){return `<button class="overlay" data-a="close"></button><aside class="sidebar"><div class="row between"><div><h2>Banco de perguntas</h2><p class="muted">${state.bank.length} perguntas ativas</p></div><button class="ghost close" data-a="close">×</button></div><div class="grid" style="margin-top:28px"><button class="btn" data-a="export">Exportar JSON</button><label class="outline" style="text-align:center;cursor:pointer">Importar JSON<input id="import" class="hidden" type="file" accept=".json,application/json"></label><button class="outline" data-a="restore">Repor 1000 perguntas</button></div>${state.status?`<p class="status" style="margin-top:18px">${esc(state.status)}</p>`:''}<div class="panel muted" style="margin-top:26px"><b style="color:white">Formato aceite</b><p>Lista JSON com: id, category, difficulty, question, options, answer e explanation.</p></div></aside>`}
function start(){let fs=filtered();if(!fs.length)return;let avail=fs.filter(q=>!state.used.includes(q.id));if(avail.length<Math.min(state.count,fs.length)){avail=fs;state.used=state.used.filter(id=>!new Set(fs.map(q=>q.id)).has(id))}state.game=shuffle(avail).slice(0,Math.min(state.count,avail.length));state.used=[...new Set([...state.used,...state.game.map(q=>q.id)])];state.games++;localStorage.setItem(STORAGE.used,JSON.stringify(state.used));localStorage.setItem(STORAGE.games,state.games);state.scores=state.teams.map(()=>0);Object.assign(state,{index:0,selected:null,revealed:false,active:0,paused:false,time:state.seconds,screen:'game'});render()}
function game(){const q=state.game[state.index];if(!q){state.screen='home';return render()}const rank=state.teams.map((t,i)=>({t,i,s:state.scores[i]||0})).sort((a,b)=>b.s-a.s);app.innerHTML=`<main class="fixed-game"><div class="wrap"><div class="row between game-top"><div>Pergunta ${state.index+1} de ${state.game.length}<div class="cyan">${esc(classic(q.category))} · ${esc(q.difficulty)}</div></div><div class="row"><button class="danger" data-a="finish">Sair e ver classificação</button>${state.auto?`<button class="outline" data-a="pause">${state.paused?'▶ Continuar':'⏸ Pausar'}</button>`:''}<b style="font-size:1.6rem">⏱ ${state.time}s</b></div></div><div class="grid g4 scoreboard">${rank.map((x,p)=>`<div class="team ${x.i===state.active?'active':''}"><div class="row between"><b>${p===0?'🏆 ':''}${esc(x.t)}</b><b>${x.s}</b></div><small>${x.i===state.active?'▶ Equipa ativa':`${x.s} pts`}</small></div>`).join('')}</div><div class="card quiz-card"><div class="panel" style="color:#f5d0fe">▶ A responder: ${esc(state.teams[state.active])}</div><h2 class="question-title">${esc(q.question)}</h2><div class="answers">${q.options.map((o,i)=>`<button class="answer ${state.revealed&&i===q.answer?'correct':state.revealed&&i===state.selected?'wrong':state.selected===i?'selected':''}" data-opt="${i}" ${(state.revealed||(state.auto&&!state.manual))?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${state.revealed?`<p class="status">${esc(q.explanation||'')}</p>`:''}<div class="row game-actions" style="justify-content:flex-end">${!state.revealed?`<button class="btn" data-a="reveal" ${state.selected===null?'disabled':''}>${state.auto?'Revelar já':'Revelar'}</button>`:`<button class="btn" data-a="next">${state.index===state.game.length-1?'Classificação':state.auto?'Avançar agora':'Próxima'}</button>`}</div></div></div></main>`;bind();if(!state.revealed&&!state.paused&&state.time>0)timer=setTimeout(()=>{state.time--;if(state.time===0)reveal();else render()},1000);if(state.auto&&state.revealed&&!state.paused)autoTimer=setTimeout(next,8000)}
function reveal(){if(state.revealed)return;state.revealed=true;let q=state.game[state.index];if(state.selected===q.answer)state.scores[state.active]+=POINTS[q.difficulty]||1;render()}function next(){if(state.index>=state.game.length-1){state.screen='results';return render()}state.index++;state.active=state.teams.length===1?0:(state.active+1)%state.teams.length;state.selected=null;state.revealed=false;state.time=state.seconds;render()}
function results(){let rank=state.teams.map((t,i)=>({t,s:state.scores[i]||0})).sort((a,b)=>b.s-a.s);app.innerHTML=`<main><div class="wrap" style="max-width:700px;text-align:center"><div class="amber" style="font-size:72px">🏆</div><h1>Classificação</h1>${rank.map((x,i)=>`<div class="team row between" style="margin:10px 0"><b>${i+1}. ${esc(x.t)}</b><b>${x.s} pts</b></div>`).join('')}<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-a="start">↻ Nova partida</button><button class="outline" data-a="home">Definições</button></div></div></main>`;bind()}
function exportBank(){let b=new Blob([JSON.stringify(state.bank,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`quiz-de-bar-${state.bank.length}-perguntas.json`;a.click();URL.revokeObjectURL(u);state.status=`${state.bank.length} perguntas exportadas.`;render()}
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('O ficheiro deve conter uma lista de perguntas.');let ids=new Set;return data.map((x,i)=>{let options=Array.isArray(x.options)?x.options.map(String):[],answer=Number(x.answer),id=String(x.id||`imported-${Date.now()}-${i+1}`);if(!x.question||!x.category||options.length<2||!Number.isInteger(answer)||answer<0||answer>=options.length)throw Error(`Pergunta ${i+1} inválida.`);if(ids.has(id))throw Error(`ID duplicado: ${id}`);ids.add(id);return{id,category:String(x.category),difficulty:['Fácil','Médio','Difícil'].includes(x.difficulty)?x.difficulty:'Médio',question:String(x.question),options,answer,explanation:String(x.explanation||'')}})}
function bind(){document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{let a=e.dataset.a;if(a==='sidebar')state.sidebar=true;if(a==='close')state.sidebar=false;if(a==='addteam'&&state.teams.length<8)state.teams.push(`Equipa ${state.teams.length+1}`);if(a==='allcats')state.cats=[...CLASSIC];if(a==='nocats')state.cats=[];if(a==='clear'){state.used=[];state.games=0;localStorage.removeItem(STORAGE.used);localStorage.removeItem(STORAGE.games)}if(a==='start')start();if(a==='full')(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());if(a==='finish'){state.screen='results'}if(a==='pause')state.paused=!state.paused;if(a==='reveal')reveal();if(a==='next')next();if(a==='home')state.screen='home';if(a==='export')exportBank();if(a==='restore'){state.bank=DEFAULT_BANK;localStorage.removeItem(STORAGE.bank);state.used=[];localStorage.removeItem(STORAGE.used);state.status='Banco padrão de 1000 perguntas restaurado.'}render()});document.querySelectorAll('[data-team]').forEach(e=>e.oninput=()=>state.teams[+e.dataset.team]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.teams.splice(+e.dataset.remove,1);render()});document.querySelectorAll('[data-cat]').forEach(e=>e.onchange=()=>{state.cats=e.checked?[...state.cats,e.dataset.cat]:state.cats.filter(x=>x!==e.dataset.cat);render()});document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{let k=e.dataset.f;state[k]=e.type==='checkbox'?e.checked:(['count','seconds'].includes(k)?+e.value:e.value);render()});document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>{state.selected=+e.dataset.opt;render()});let imp=document.getElementById('import');if(imp)imp.onchange=async()=>{let f=imp.files[0];if(!f)return;try{state.bank=validate(JSON.parse(await f.text()));saveBank();state.used=[];localStorage.removeItem(STORAGE.used);state.status=`${state.bank.length} perguntas importadas com sucesso.`}catch(err){state.status=err.message||'Falha ao importar.'}render()}}
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('browser-fullscreen',Boolean(document.fullscreenElement));if(state.screen==='game')render();});
render();
</script>
</body>
