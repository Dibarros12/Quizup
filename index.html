.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}.stat-card{padding:14px;border:1px solid var(--line);border-radius:16px;background:#171e34}.stat-card strong{display:block;font-size:1.7rem}.pack-list{display:grid;gap:8px;margin:16px 0}.pack-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#171e34}.app-controls{display:grid;gap:7px;margin-top:auto}.app-controls button{min-height:42px;border:1px solid var(--line);border-radius:13px;background:#171e34;text-align:left;padding:8px 11px}.app-controls+.app-version{margin-top:10px}.territory{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.territory:hover:not(:disabled){transform:translateY(-2px);border-color:#f5b94288}.territory.conquer-flash{animation:conquer .7s ease}.card{animation:screenIn .2s ease}.capital-ready{animation:pulseGold 1.5s infinite}.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:min(360px,calc(100vw - 40px));padding:13px 16px;border:1px solid #f5b94288;border-radius:15px;background:#11182cf5;box-shadow:0 16px 45px #0008;animation:toastIn .25s ease}.confirm-layer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:#050712cc}.confirm-box{width:min(430px,100%);padding:22px;border:1px solid var(--line);border-radius:22px;background:#11182c}.confirm-box h2{margin-bottom:8px}@keyframes screenIn{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes conquer{0%{transform:scale(.94)}50%{transform:scale(1.04);box-shadow:0 0 32px #f5b94299}100%{transform:none}}@keyframes pulseGold{50%{box-shadow:0 0 24px #f5b94266;border-color:#f5b942}}@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:850px){.app-controls{grid-template-columns:1fr 1fr;margin-top:10px}.app-side{max-height:none}.game-host{min-height:60vh}}@media(max-width:520px){.app-shell{padding:5px;gap:7px}.app-side,.card{border-radius:18px}.app-side{padding:10px}.app-brand{margin-bottom:8px}.app-nav button{min-height:42px;padding:8px 10px}.scores{grid-template-columns:1fr 1fr}.question{margin:12px 0}.answers{grid-template-columns:1fr}.map{gap:7px}.territory{min-height:92px}.confidence{gap:7px}.risk{padding:10px}.top.between{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="app-shell"><aside class="app-side"><div class="app-brand">🧠 Quiz Up</div><div class="app-nav"><div class="app-section">JOGAR</div><button id="navClassic">▶️ Jogar</button><button id="navConqueror" class="conqueror active">⚔️ Conqueror</button><div class="app-section">PROGRESSO</div><button>📊 Estatísticas</button><button>🏆 Hall of Fame</button><button>🎖️ Conquistas</button><div class="app-section">CONTEÚDO</div><button>🗂️ Banco de perguntas</button><button id="packsButton">📦 Packs</button><input id="bankFile" type="file" accept=".json,application/json" multiple hidden><div id="bankStatus" class="app-version" style="margin-top:8px">Packs: banco interno</div><div class="app-section">SISTEMA</div><button>⚙️ Definições</button></div><div class="app-controls"><button id="soundToggle" title="Ativar ou desativar som" aria-pressed="true">🔊 Som</button><button id="fullscreenToggle" title="Ecrã inteiro">⛶ Ecrã inteiro</button></div><div class="app-version">Fase 5 · Finalização</div></aside><div class="game-host"><div class="wrap"><main id="app" aria-live="polite"></main></div></div></div><script>

const categoryAliases={geo:['geografia','mundo','países','paises'],hist:['história','historia'],sci:['ciência','ciencia','natureza'],cult:['cultura','arte','literatura'],sport:['desporto','esporte','futebol'],tech:['tecnologia','informática','informatica'],ent:['entretenimento','cinema','televisão','televisao','música','musica']};
function clean(x){return String(x??'').trim()}function fold(x){return clean(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function findArray(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return[];for(const k of ['questions','perguntas','items','data','quiz'])if(Array.isArray(data[k]))return data[k];for(const v of Object.values(data))if(Array.isArray(v)&&v.length)return v;return[]}
function normalizeQuestion(x,i){if(!x||typeof x!=='object')return null;let q=clean(x.question??x.pergunta??x.q??x.text);let cat=clean(x.category??x.categoria??x.tema??x.topic);let options=x.options??x.opcoes??x.respostas??x.answers;let correct=x.correctIndex??x.correct??x.correta??x.respostaCorreta??x.answer;let explanation=clean(x.explanation??x.explicacao??x.justificacao??x.feedback);if(!Array.isArray(options)||options.length<2||!q)return null;options=options.map(v=>typeof v==='object'?clean(v.text??v.label??v.answer):clean(v));let a=-1;if(Number.isInteger(correct))a=correct;else if(typeof correct==='string'){a=options.findIndex(v=>fold(v)===fold(correct));if(a<0&&/^[A-D]$/i.test(correct))a=correct.toUpperCase().charCodeAt(0)-65}else if(correct&&typeof correct==='object')a=options.findIndex(v=>fold(v)===fold(correct.text??correct.answer));if(a<0||a>=options.length)return null;return{id:clean(x.id??x._id??`${cat}-${i}-${q}`),cat,q,o:options,a,e:explanation||`Resposta correta: ${options[a]}.`}}
function importQuestions(data,name='Pack'){let normalized=findArray(data).map(normalizeQuestion).filter(Boolean);if(!normalized.length)throw new Error('Não foram encontradas perguntas válidas.');let known=new Set(realBank.map(q=>q.id));realBank.push(...normalized.filter(q=>!known.has(q.id)));if(!packNames.includes(name))packNames.push(name);usedQuestions.clear();persistPacks();bankStatus.textContent=`Packs ativos: ${packNames.length} · ${realBank.length} perguntas`;bankStatus.style.color='#22c55e';return normalized.length}
function poolFor(t){if(!realBank.length)return t.q;let aliases=categoryAliases[t.id]||[];let pool=realBank.filter(q=>t.id==='capital'||aliases.some(a=>fold(q.cat).includes(fold(a))));if(pool.length<3)pool=realBank;let fresh=pool.filter(q=>!usedQuestions.has(q.id));if(fresh.length<3){for(const q of pool)usedQuestions.delete(q.id);fresh=pool.slice()}for(let i=fresh.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}let selected=fresh.slice(0,3);selected.forEach(q=>usedQuestions.add(q.id));return selected.map(q=>({q:q.q,o:q.o,a:q.a,e:q.e}))}
let soundOn=localStorage.getItem('quizup_sound')!=='off';function beep(kind='tap'){if(!soundOn)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=kind==='good'?660:kind==='bad'?190:kind==='win'?880:420;gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.17)}catch{}}function toast(msg){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}function confirmLeave(action,{title='Sair da conquista?',message='A partida fica guardada e pode ser retomada mais tarde.',confirmText='Guardar e sair',clear=false}={}){let layer=document.createElement('div');layer.className='confirm-layer';layer.innerHTML=`<div class="confirm-box"><h2>${esc(title)}</h2><p class="muted">${esc(message)}</p><div class="row"><button id="stayGame">Cancelar</button><button class="primary" id="leaveGame">${esc(confirmText)}</button></div></div>`;document.body.appendChild(layer);layer.querySelector('#stayGame').onclick=()=>layer.remove();layer.querySelector('#leaveGame').onclick=()=>{clear?clearGame():saveGame();layer.remove();action()}}function updateGlobalControls(){soundToggle.textContent=soundOn?'🔊 Som':'🔇 Som';soundToggle.setAttribute('aria-pressed',String(soundOn));fullscreenToggle.textContent=document.fullscreenElement?'🡼 Sair do ecrã inteiro':'⛶ Ecrã inteiro'}
function defaultStats(){return{games:0,wins:0,territories:0,stolen:0,chains:0,capitals:0,bestScore:0}}function loadStats(){try{return{...defaultStats(),...JSON.parse(localStorage.getItem(STATS_KEY)||'{}')}}catch{return defaultStats()}}function saveStats(x){localStorage.setItem(STATS_KEY,JSON.stringify(x))}function saveGame(){if(['map','confidence','question'].includes(s.view))localStorage.setItem(GAME_KEY,JSON.stringify({...s,usedQuestions:[...usedQuestions]}))}function clearGame(){localStorage.removeItem(GAME_KEY)}function hasSavedGame(){return !!localStorage.getItem(GAME_KEY)}function continueGame(){try{let x=JSON.parse(localStorage.getItem(GAME_KEY));usedQuestions=new Set(x.usedQuestions||[]);delete x.usedQuestions;s={...s,...x};render()}catch{clearGame();s.view='setup';render()}}function persistPacks(){localStorage.setItem(PACK_KEY,JSON.stringify({questions:realBank,names:packNames}))}function restorePacks(){try{let x=JSON.parse(localStorage.getItem(PACK_KEY)||'{}');if(Array.isArray(x.questions)){realBank=x.questions;packNames=x.names||[];bankStatus.textContent=`Packs ativos: ${packNames.length} · ${realBank.length} perguntas`}}catch{}}

function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function owned(i){return Object.values(s.owners).filter(v=>v===i).length}function scores(){return `<div class="scores">${s.teams.map((t,i)=>`<div class="score ${i===s.active?'active':''}"><b>${esc(t)}</b><div>${s.scores[i]} pts · ${owned(i)} territórios</div></div>`).join('')}</div>`}function render(){({home,setup,map,confidence,question,end})[s.view]();saveGame()}
function home(){let st=loadStats();app.innerHTML=`<section class="card"><div class="kicker">Modo estratégico independente</div><h1>Quiz Up Conqueror</h1><p class="muted">Os Packs carregados ficam disponíveis tanto no quiz clássico como no Conqueror.</p><div class="home-actions"><button class="primary" id="newGame">Nova conquista</button>${hasSavedGame()?'<button id="continueGameBtn">Continuar partida</button>':''}<button id="showStats">Estatísticas Conqueror</button></div><div class="stats-grid"><div class="stat-card"><span>Partidas</span><strong>${st.games}</strong></div><div class="stat-card"><span>Vitórias</span><strong>${st.wins}</strong></div><div class="stat-card"><span>Territórios</span><strong>${st.territories}</strong></div></div></section>`;newGame.onclick=()=>{clearGame();usedQuestions.clear();s={...s,view:'setup',scores:s.teams.map(()=>0),owners:{},active:0,winner:null,chains:0,stolen:0};render()};let c=document.getElementById('continueGameBtn');if(c)c.onclick=continueGame;showStats.onclick=statsView}function statsView(){let st=loadStats();app.innerHTML=`<section class="card"><div class="kicker">Conqueror</div><h1>Estatísticas</h1><div class="stats-grid"><div class="stat-card"><span>Partidas jogadas</span><strong>${st.games}</strong></div><div class="stat-card"><span>Vitórias</span><strong>${st.wins}</strong></div><div class="stat-card"><span>Capitais</span><strong>${st.capitals}</strong></div><div class="stat-card"><span>Territórios</span><strong>${st.territories}</strong></div><div class="stat-card"><span>Territórios roubados</span><strong>${st.stolen}</strong></div><div class="stat-card"><span>Cadeias completas</span><strong>${st.chains}</strong></div><div class="stat-card"><span>Melhor pontuação</span><strong>${st.bestScore}</strong></div></div><button id="statsBack">Voltar</button></section>`;statsBack.onclick=()=>{s.view='home';render()}}let packsReturnView='home';function packsView(){app.innerHTML=`<section class="card"><div class="kicker">Conteúdo partilhado</div><h1>Packs</h1><p class="muted">Os packs importados alimentam o quiz clássico e o Conqueror.</p><div class="pack-list">${packNames.length?packNames.map(n=>`<div class="pack-item">📦 ${esc(n)}</div>`).join(''):'<div class="pack-item">Nenhum pack externo carregado.</div>'}</div><div class="row"><button class="primary" id="addPacks">Importar packs</button>${packNames.length?'<button id="clearPacks">Remover packs</button>':''}<button id="packsBack">Voltar</button></div></section>`;addPacks.onclick=()=>bankFile.click();let cp=document.getElementById('clearPacks');if(cp)cp.onclick=()=>{realBank=[];packNames=[];localStorage.removeItem(PACK_KEY);bankStatus.textContent='Packs: banco interno';packsView()};packsBack.onclick=()=>{s.view=packsReturnView;render()}}
function setup(){app.innerHTML=`<section class="card"><div class="kicker">Quiz Up Conqueror · Fase 5</div><h1>Conquista o conhecimento</h1><p class="muted">Agora o nível de confiança é escolhido antes de a pergunta ser revelada.</p><h2>Equipas</h2><div class="teams">${s.teams.map((t,i)=>`<div class="team"><input data-team="${i}" value="${esc(t)}"><button data-rm="${i}" ${s.teams.length<=2?'disabled':''}>×</button></div>`).join('')}</div><div class="row"><button id="add" ${s.teams.length>=4?'disabled':''}>+ Equipa</button><button class="primary" id="start">Começar</button></div></section>`;document.querySelectorAll('[data-team]').forEach(x=>x.oninput=()=>s.teams[+x.dataset.team]=x.value||`Equipa ${+x.dataset.team+1}`);document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{s.teams.splice(+x.dataset.rm,1);setup()});add.onclick=()=>{s.teams.push(`Equipa ${s.teams.length+1}`);setup()};start.onclick=()=>{s.scores=s.teams.map(()=>0);s.view='map';render()}}
function map(){let unlocked=Object.keys(s.owners).filter(x=>x!=='capital').length>=3;app.innerHTML=`<section class="card"><div class="top between"><div><div class="kicker">Turno de ${esc(s.teams[s.active])}</div><h2>Escolhe um território</h2></div><button id="reset">Reiniciar</button></div>${scores()}<div class="map">${T.map(t=>{let o=s.owners[t.id],lock=t.c&&!unlocked;return `<button class="territory ${lock?'locked':''} ${t.c&&unlocked?'capital-ready':''}" data-t="${t.id}" data-owner="${o??''}" ${lock?'disabled':''}><span class="icon">${t.i}</span><b>${t.n}</b><small>${o===undefined?(lock?'Bloqueada: conquista 3 territórios':'Neutro'):`Controlado por ${esc(s.teams[o])}`}</small></button>`}).join('')}</div><div class="notice"><b>Cadeias:</b> duas respostas certas conquistam o território; a terceira dá um bónus de 3 pontos.</div></section>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{s.territory=b.dataset.t;let target=T.find(x=>x.id===s.territory);target.q=poolFor(target);s.step=0;s.bank=0;s.risk=null;s.view='confidence';render()});reset.onclick=()=>confirmLeave(()=>{s.owners={};s.scores=s.teams.map(()=>0);s.active=0;s.territory=null;s.winner=null;s.view='home';render()},{title:'Abandonar partida?',message:'O progresso desta conquista será eliminado. Os Packs e as estatísticas serão mantidos.',confirmText:'Abandonar',clear:true})}
function confidence(){let t=T.find(x=>x.id===s.territory);app.innerHTML=`<section class="card"><div class="kicker">${t.i} Ataque a ${t.n} · Cadeia ${s.step+1}/3</div><h2>Escolhe o nível de confiança</h2>${scores()}<p class="muted">A pergunta só aparece depois de confirmares o risco.</p><div class="confidence">${Object.entries(risks).map(([k,r])=>`<button class="risk ${s.risk===k?'selected':''}" data-risk="${k}"><span>${r.i}</span><b>${r.n}</b><small>${r.d}</small></button>`).join('')}</div><div class="row"><button id="back">Voltar ao mapa</button><button class="primary" id="show" ${s.risk?'':'disabled'}>Revelar pergunta</button></div></section>`;document.querySelectorAll('[data-risk]').forEach(b=>b.onclick=()=>{s.risk=b.dataset.risk;confidence()});back.onclick=()=>{s.view='map';next();render()};show.onclick=()=>{s.chosen=null;s.reveal=false;s.result='';s.view='question';render()}}
function question(){let t=T.find(x=>x.id===s.territory),q=t.q[s.step],r=risks[s.risk];app.innerHTML=`<section class="card"><div class="top between"><div><div class="kicker">${t.i} ${t.n}</div><h2>${r.i} ${r.n}</h2></div><b>${s.bank} pontos acumulados</b></div>${scores()}<div class="chain"><b>Cadeia ${s.step+1}/3</b><div class="steps">${[0,1,2].map(i=>`<span class="step ${i<s.step?'done':''}"></span>`).join('')}</div></div><div class="question">${q.q}</div><div class="answers">${q.o.map((o,i)=>`<button class="answer ${s.reveal?(i===q.a?'correct':i===s.chosen?'wrong':''):''}" data-a="${i}" ${s.reveal?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${s.reveal?result(q,r):''}</section>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a));let n=document.getElementById('nextQ');if(n)n.onclick=advance;let c=document.getElementById('capture');if(c)c.onclick=()=>take(false)}
function answer(i){let q=T.find(x=>x.id===s.territory).q[s.step],r=risks[s.risk];s.chosen=i;s.reveal=true;if(i===q.a){s.bank+=r.w;s.result='ok';beep('good')}else{s.scores[s.active]=Math.max(0,s.scores[s.active]-r.l);s.result='bad';beep('bad')};question()}
function result(q,r){if(s.result==='bad')return `<div class="result bad"><b>Incorreta</b><div>${q.e}</div><button class="primary" id="nextQ">Terminar turno</button></div>`;let can=s.step>=1;return `<div class="result good"><b>Correta · +${r.w}</b><div>${q.e}</div><div class="row" style="margin-top:10px">${s.step<2?`<button class="primary" id="nextQ">${can?'Continuar para o bónus':'Continuar a cadeia'}</button>`:''}${can?'<button id="capture">Conquistar agora</button>':''}</div></div>`}
function advance(){if(s.result==='bad'){next();s.view='map';return render()}if(s.step<2){s.step++;s.risk=null;s.view='confidence';return render()}take(true)}function take(full){let old=s.owners[s.territory],attacker=s.active,territoryName=T.find(x=>x.id===s.territory).n;s.owners[s.territory]=s.active;s.scores[s.active]+=s.bank+(full?3:0);if(full)s.chains++;if(old!==undefined&&old!==s.active){s.stolen++;s.scores[old]=Math.max(0,s.scores[old]-1)}if(s.territory==='capital'){s.winner=s.active;let st=loadStats();st.games++;st.wins++;st.capitals++;st.territories+=owned(s.active);st.stolen+=s.stolen;st.chains+=s.chains;st.bestScore=Math.max(st.bestScore,s.scores[s.active]);saveStats(st);clearGame();beep('win');s.view='end';return render()}next();s.view='map';render();beep('good');toast(`${s.teams[attacker]} conquistou ${territoryName}${old!==undefined&&old!==attacker?' a outra equipa':' '}!`);let tile=document.querySelector(`[data-t="${s.territory}"]`);if(tile)tile.classList.add('conquer-flash')}function next(){s.active=(s.active+1)%s.teams.length}
function end(){app.innerHTML=`<section class="card winner"><div class="crown">👑</div><div class="kicker">Capital conquistada</div><h1>${esc(s.teams[s.winner])}</h1><p>${s.scores[s.winner]} pontos · ${owned(s.winner)} territórios</p><button class="primary" id="again">Nova partida</button></section>`;again.onclick=()=>{s.owners={};s.scores=s.teams.map(()=>0);s.active=0;s.winner=null;s.view='home';render()}}
packsButton.onclick=()=>{packsReturnView=['map','confidence','question'].includes(s.view)?s.view:'home';packsView()};bankFile.onchange=async()=>{let files=[...bankFile.files];let loaded=0,errors=[];for(const file of files){try{loaded+=importQuestions(JSON.parse(await file.text()),file.name.replace(/\.json$/i,''))}catch(e){errors.push(`${file.name}: ${e.message}`)}}bankFile.value='';packsView();if(errors.length)alert(`Alguns packs não foram importados:
${errors.join('\n')}`)};restorePacks();
function showClassic(){navClassic.classList.add('active');navConqueror.classList.remove('active');app.innerHTML=`<section class="card placeholder"><div class="kicker">Quiz Up</div><h1>Quiz clássico</h1><p class="muted">Os modos clássicos permanecem separados do Conqueror, mas utilizam os mesmos Packs ativos.</p><button class="primary" id="returnConq">Abrir Conqueror</button></section>`;returnConq.onclick=navConqueror.onclick}navClassic.onclick=()=>{if(['map','confidence','question'].includes(s.view))confirmLeave(showClassic);else showClassic()};navConqueror.onclick=()=>{navConqueror.classList.add('active');navClassic.classList.remove('active');if(!['map','confidence','question'].includes(s.view))s.view='home';render()};soundToggle.onclick=()=>{soundOn=!soundOn;localStorage.setItem('quizup_sound',soundOn?'on':'off');updateGlobalControls();beep('tap')};fullscreenToggle.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}updateGlobalControls()};document.addEventListener('fullscreenchange',updateGlobalControls);window.addEventListener('beforeunload',e=>{if(['map','confidence','question'].includes(s.view)){saveGame();e.preventDefault();e.returnValue=''}});updateGlobalControls();render();
</script></body></html>
