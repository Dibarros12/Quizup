<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>Quiz Up v4.4 Single Sidebar</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#020617}
    *{box-sizing:border-box}body{margin:0;background:#020617;color:#fff}button,input,select{font:inherit}
    button,select,input{border-radius:12px;border:1px solid #ffffff1a;background:#0f172a;color:#fff;padding:11px 14px}
    button{cursor:pointer}.btn{background:#c026d3;border:0;font-weight:800}.outline{background:transparent}.ghost{background:#ffffff0d}.danger{background:#dc2626;border:0}
    main{min-height:100vh;padding:24px}.wrap{max-width:1050px;margin:auto}.card{background:#ffffff10;border:1px solid #ffffff1a;border-radius:24px;padding:26px;box-shadow:0 18px 50px #0004}
    h1{font-size:clamp(2.2rem,8vw,4rem);margin:.2rem 0}.muted{color:#94a3b8}.cyan{color:#67e8f9}.amber{color:#fde68a}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.space>*+*{margin-top:18px}
    .panel{background:#0f172ab3;border-radius:18px;padding:16px}.team{border:1px solid #ffffff1a;border-radius:16px;padding:14px;background:#ffffff08}.active{border-color:#e879f9;background:#d946ef24}
    .cat{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #ffffff1a;border-radius:14px;background:#02061766}.cat.on{border-color:#e879f9;background:#d946ef22}
    .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.answer{text-align:left;padding:18px;font-weight:800;border:2px solid #ffffff1a}.answer.selected{border-color:white;background:#ffffff24}.answer.correct{border-color:#a7f3d0;background:#10b981}.answer.wrong{border-color:#fecaca;background:#ef4444}
    .fixed-game{position:fixed;inset:0;z-index:40;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#020617;padding:clamp(8px,1.4vh,16px)}
    .fixed-game .wrap{height:100%;max-width:min(1200px,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(6px,1vh,12px);overflow:hidden}
    .fixed-game .game-top{min-height:0}
    .fixed-game .scoreboard{margin:0!important;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:clamp(5px,.8vh,10px)}
    .fixed-game .team{padding:clamp(7px,1vh,11px);min-width:0}
    .fixed-game .quiz-card{min-height:0;height:100%;overflow:hidden;padding:clamp(12px,2vh,22px);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(7px,1.1vh,13px)}
    .fixed-game .quiz-card .panel{padding:clamp(8px,1.2vh,12px)}
    .fixed-game .question-title{font-size:clamp(1.8rem,4.8vh,3.35rem)!important;line-height:1.1;margin:0;overflow-wrap:anywhere}
    .fixed-game .answers{min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(6px,1vh,11px)}
    .fixed-game .answer{min-height:0;padding:clamp(10px,1.6vh,18px);font-size:clamp(1rem,2.2vh,1.28rem);line-height:1.15;overflow-wrap:anywhere}
    .fixed-game .status{margin:0;padding:clamp(7px,1vh,11px);font-size:clamp(.78rem,1.7vh,.96rem)}
    .fixed-game .game-actions{margin-top:0!important}
    body.game-active{overflow:hidden;height:100vh;height:100dvh}
    body.game-active #app{height:100vh;height:100dvh;overflow:hidden}
    :fullscreen{overflow:hidden}
    :fullscreen .fixed-game{width:100vw;height:100vh;height:100dvh}
    @media(max-width:700px){.fixed-game .answers{grid-template-columns:1fr}.fixed-game .scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-height:720px){.fixed-game{padding:7px}.fixed-game .scoreboard{display:flex;overflow:hidden}.fixed-game .team{flex:1;padding:6px}.fixed-game .team small{display:none}.fixed-game .quiz-card{padding:10px}.fixed-game .question-title{font-size:clamp(1.05rem,3vh,1.7rem)!important}.fixed-game .answer{padding:7px}.fixed-game .panel{padding:7px}}.overlay{position:fixed;inset:0;background:#0009;z-index:60}.sidebar{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);z-index:70;background:#020617;border-left:1px solid #ffffff1a;padding:24px;overflow:auto}.close{font-size:24px}
    .status{padding:12px;border-radius:12px;background:#06b6d41c;color:#a5f3fc}.stat{text-align:center;padding:12px}.stat b{display:block;font-size:1.7rem}.hidden{display:none}.titlebar{position:relative;text-align:center}.bankbtn{position:absolute;right:0;top:0}
    @media(max-width:650px){main{padding:12px}.card{padding:18px}.bankbtn{position:static;margin-bottom:12px;width:100%}}
  
    .results-wrap{max-width:950px;margin:auto}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.summary-card{border:1px solid #ffffff1a;background:#ffffff08;border-radius:16px;padding:14px;text-align:center}.summary-card b{display:block;font-size:1.65rem}.category-row{display:grid;grid-template-columns:minmax(140px,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff12}.failed-list{display:grid;gap:10px}.failed-item{border:1px solid #ffffff1a;background:#02061766;border-radius:14px;padding:14px}.failed-item p{margin:.35rem 0}.team-stats{margin-top:18px;text-align:left}.team-stats>summary{cursor:pointer;list-style:none}.team-stats>summary::-webkit-details-marker{display:none}
    @media(max-width:700px) and (orientation:portrait){
      .fixed-game{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
      .fixed-game .wrap{grid-template-rows:auto auto minmax(0,1fr);gap:5px}
      .fixed-game .game-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-size:.82rem}
      .fixed-game .game-top>.row{gap:5px;justify-content:flex-end;flex-wrap:nowrap}
      .fixed-game .game-top button{padding:7px 8px;font-size:.74rem;white-space:nowrap}
      .fixed-game .game-top b{font-size:1rem!important;white-space:nowrap}
      .fixed-game .scoreboard{display:block;min-height:0}
      .fixed-game .scoreboard .team{display:none}
      .fixed-game .scoreboard .team.active{display:block;padding:7px 9px}
      .fixed-game .scoreboard .team small{display:none}
      .fixed-game .quiz-card{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:0}
      .fixed-game .quiz-card .panel{padding:7px 9px;font-size:.78rem;flex:0 0 auto}
      .fixed-game .question-title{font-size:clamp(1.3rem,3.4vh,2rem)!important;line-height:1.08;flex:0 0 auto}
      .fixed-game .answers{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:5px;flex:1 1 auto;min-height:0}
      .fixed-game .answer{padding:8px 10px;font-size:clamp(.92rem,2vh,1.12rem);line-height:1.08}
      .fixed-game .status{padding:6px 8px;font-size:.72rem;line-height:1.15;max-height:12vh;overflow:auto;flex:0 0 auto}
      .fixed-game .game-actions{flex:0 0 auto}
      .fixed-game .game-actions button{width:100%;padding:8px}
      .results-wrap{padding-bottom:24px}.category-row{grid-template-columns:1fr auto auto;font-size:.88rem}.failed-item{padding:11px}
    }


    /* QuizUp 1.1: acabamento visual do ecrã de jogo */
    .fixed-game{background:radial-gradient(circle at 12% 0%,#312e8155 0,transparent 34%),radial-gradient(circle at 92% 100%,#86198f44 0,transparent 38%),linear-gradient(145deg,#020617 0%,#0b1024 52%,#160b2b 100%)}
    .fixed-game .game-top{background:#0f172acc;border:1px solid #ffffff1a;border-radius:18px;padding:10px 14px;box-shadow:0 12px 32px #0005;backdrop-filter:blur(12px)}
    .question-progress{font-size:.86rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#cbd5e1}
    .question-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
    .meta-pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.76rem;font-weight:850;background:#22d3ee18;border:1px solid #67e8f955;color:#a5f3fc}
    .meta-pill.difficulty{background:#f59e0b18;border-color:#fbbf2455;color:#fde68a}
    .timer-pill{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:9px 13px;border-radius:15px;background:#020617cc;border:1px solid #67e8f966;color:#ecfeff;font-size:1.28rem;font-weight:900;box-shadow:inset 0 0 0 1px #ffffff08,0 0 24px #06b6d425}
    .fixed-game .scoreboard .team{background:linear-gradient(145deg,#ffffff0c,#ffffff05);transition:transform .2s ease,border-color .2s ease,background .2s ease;box-shadow:0 8px 20px #0003}
    .fixed-game .scoreboard .team.active{transform:translateY(-2px);border-color:#e879f9;background:linear-gradient(145deg,#d946ef35,#7c3aed22);box-shadow:0 10px 26px #a21caf3b}
    .active-team-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#7e22ce55,#0891b255)!important;border:1px solid #e879f966;color:#fdf4ff!important;font-weight:850}
    .active-team-banner span:last-child{color:#bae6fd;font-size:.82rem}
    .fixed-game .quiz-card{background:linear-gradient(155deg,#ffffff13,#ffffff08);border-color:#ffffff24;box-shadow:0 24px 70px #0007,inset 0 1px 0 #ffffff14}
    .fixed-game .question-title{text-align:center;display:flex;align-items:center;justify-content:center;text-wrap:balance;padding:0 clamp(4px,2vw,26px);text-shadow:0 3px 20px #0009}
    .fixed-game .answer{position:relative;background:linear-gradient(150deg,#111c36,#0b1328);border-color:#334155;color:#f8fafc;border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px #0003;transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
    .fixed-game .answer:hover:not(:disabled){transform:translateY(-2px);border-color:#67e8f9;box-shadow:0 14px 30px #06b6d426}
    .fixed-game .answer:active:not(:disabled){transform:scale(.99)}
    .answer-letter{display:inline-grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:#ffffff12;border:1px solid #ffffff24;color:#a5f3fc;font-size:.9em;font-weight:950}
    .answer-text{min-width:0}
    .fixed-game .answer.selected{border-color:#e879f9;background:linear-gradient(150deg,#701a7555,#312e8166);box-shadow:0 0 0 2px #e879f933,0 14px 30px #a21caf33}
    .fixed-game .answer.correct{border-color:#6ee7b7;background:linear-gradient(145deg,#047857,#065f46);box-shadow:0 0 0 2px #6ee7b733,0 14px 30px #10b98133}
    .fixed-game .answer.wrong{border-color:#fca5a5;background:linear-gradient(145deg,#b91c1c,#7f1d1d);box-shadow:0 0 0 2px #fca5a533,0 14px 30px #ef444433}
    .fixed-game .status{border:1px solid #67e8f944;background:linear-gradient(90deg,#0e749033,#312e8133);font-weight:700}
    .fixed-game .game-actions .btn{min-width:160px;padding:11px 19px;border-radius:14px;background:linear-gradient(135deg,#c026d3,#7c3aed);box-shadow:0 10px 26px #a21caf4d;transition:transform .15s ease,filter .15s ease}
    .fixed-game .game-actions .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.12)}
    .fixed-game button:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}
    @media(max-width:700px) and (orientation:portrait){
      .fixed-game .game-top{padding:7px 9px;border-radius:13px}.question-progress{font-size:.68rem}.question-meta{margin-top:3px;gap:4px}.meta-pill{font-size:.64rem;padding:3px 6px}.timer-pill{min-width:65px;padding:6px 8px;font-size:1rem;border-radius:11px}
      .active-team-banner span:last-child{display:none}.fixed-game .answer{border-radius:14px;gap:9px}.answer-letter{width:29px;height:29px;border-radius:9px}.fixed-game .question-title{padding:0 2px}.fixed-game .game-actions .btn{min-width:0}
    }

    /* QuizUp 1.1: respostas mais legíveis e gestão protegida do banco */
    .fixed-game .answer{font-size:clamp(1.22rem,2.75vh,1.62rem);line-height:1.17;padding:clamp(9px,1.25vh,15px)}
    .answer-letter{width:45px;height:45px;border-radius:13px;font-size:1.12em}
    .answer-text{font-weight:850;line-height:1.18}
    @media(max-width:700px) and (orientation:portrait){
      .fixed-game .answer{font-size:clamp(1.05rem,2.35vh,1.34rem);padding:7px 9px}
      .answer-letter{width:38px;height:38px;border-radius:11px;font-size:1.08em}
    }

    /* Formulário integrado para acrescentar perguntas */
    .bank-form{display:grid;gap:13px;margin-top:22px;padding:18px;border:1px solid #ffffff1a;border-radius:18px;background:#0f172acc}
    .bank-form h3{margin:0;font-size:1.15rem}
    .bank-form label{display:grid;gap:6px;color:#cbd5e1;font-size:.88rem;font-weight:750}
    .bank-form input,.bank-form select,.bank-form textarea{width:100%;border:1px solid #ffffff1a;border-radius:12px;background:#020617;color:#fff;padding:11px 12px;outline:none}
    .bank-form textarea{min-height:78px;resize:vertical;line-height:1.35}
    .bank-form input:focus,.bank-form select:focus,.bank-form textarea:focus{border-color:#e879f9;box-shadow:0 0 0 3px #d946ef22}
    .bank-form .option-row{display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center}
    .bank-form .option-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#d946ef22;color:#f5d0fe;font-weight:900}
    .bank-summary{margin-top:18px;padding:14px;border-radius:14px;background:#ffffff0d;color:#cbd5e1;font-size:.9rem}

    /* Evita cortar a primeira e a última equipa no painel de pontuação */
    .fixed-game .scoreboard{padding:3px 4px 1px;overflow:visible!important}
    .fixed-game .scoreboard .team{overflow:hidden}
    .fixed-game .scoreboard .team .row{min-width:0;flex-wrap:nowrap}
    .fixed-game .scoreboard .team .row b:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:1px}
    .fixed-game .scoreboard .team .row b:last-child{flex:0 0 auto;padding-left:8px}
    @media(max-height:720px){.fixed-game .scoreboard{overflow:visible!important;padding-inline:4px}}

    /* Controlos de teclado */
    .fixed-game .answer.selected{outline:3px solid #f0abfc;outline-offset:-3px;box-shadow:0 0 0 4px #d946ef33,0 12px 30px #0004}
    kbd{display:inline-grid;place-items:center;min-width:1.65em;height:1.65em;padding:0 .35em;border:1px solid #ffffff2b;border-bottom-width:3px;border-radius:6px;background:#0f172a;color:#e2e8f0;font:700 .78em/1 system-ui}

    /* Definições em ecrã inteiro: topo visível, painel centrado e scroll normal */
    html:fullscreen,html:fullscreen body{width:100%;height:100%;overflow:auto!important;overscroll-behavior:none}
    html:fullscreen body:not(.game-active) #app{min-height:100dvh;overflow:visible}
    html:fullscreen body:not(.game-active) main{min-height:100dvh;display:block;overflow:visible;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    html:fullscreen body:not(.game-active) .wrap{width:min(1050px,100%);margin:0 auto;overflow:visible}
    html:fullscreen body:not(.game-active) .card{margin:0 auto;padding:clamp(18px,2.4vh,26px)}
    html:fullscreen body:not(.game-active) .titlebar{padding-top:0}
    html:fullscreen body:not(.game-active) .titlebar .amber{font-size:clamp(36px,5vh,54px)!important}
    html:fullscreen body:not(.game-active) .titlebar h1{font-size:clamp(2.35rem,6vh,4rem);line-height:1;margin:.05rem 0 .35rem}
    @media(max-height:850px){
      html:fullscreen body:not(.game-active) main{padding-top:10px;padding-bottom:14px}
      html:fullscreen body:not(.game-active) .card{padding-top:16px}
      html:fullscreen body:not(.game-active) .space>*+*{margin-top:14px}
    }

    /* Mobile First e iPhone */
    :root{--app-height:100dvh}
    @supports not (height:100dvh){:root{--app-height:calc(var(--vh,1vh)*100)}}
    @media(max-width:700px){
      button,.answer,input,select{min-height:44px}
      .fixed-game{height:var(--app-height);min-height:var(--app-height);padding:max(5px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
      .fixed-game .wrap{height:100%;gap:4px}
      .fixed-game .game-top{position:relative;z-index:3;padding:6px 8px;min-height:44px}
      .fixed-game .game-top>.row{margin-left:auto}
      .fixed-game .timer-pill{position:sticky;top:max(4px,env(safe-area-inset-top));z-index:8;min-width:68px;min-height:42px;font-size:1.05rem;padding:6px 9px}
      .fixed-game .scoreboard .team.active{min-height:42px;padding:6px 9px}
      .fixed-game .quiz-card{gap:5px;padding:7px;grid-template-rows:auto auto minmax(0,1fr) auto}
      .fixed-game .active-team-banner{min-height:38px;padding:6px 8px;font-size:.76rem}
      .fixed-game .question-block{position:relative;display:grid;gap:3px;align-content:center;min-height:0;padding:7px 9px;border:1px solid #67e8f944;border-radius:14px;background:linear-gradient(135deg,#0e749022,#7e22ce22);box-shadow:inset 0 1px 0 #ffffff12}
      .fixed-game .question-kicker{font-size:.64rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#67e8f9;text-align:center}
      .fixed-game .question-title{font-size:clamp(1.28rem,3.25vh,1.88rem)!important;line-height:1.08;padding:0 2px;max-height:19vh;overflow:auto;text-align:center}
      .fixed-game .answers{gap:5px;min-height:0}
      .fixed-game .answer{min-height:0;padding:6px 9px;font-size:clamp(1rem,2.12vh,1.25rem);line-height:1.07;border-radius:13px;gap:8px}
      .fixed-game .answer-letter{width:36px;height:36px;border-radius:10px;font-size:1.05em}
      .fixed-game .game-actions{position:relative;z-index:4;padding-bottom:max(0px,env(safe-area-inset-bottom))}
      .fixed-game .game-actions .btn{width:100%;min-height:46px;padding:9px 14px;font-size:1rem}
    }
    @media(max-width:390px) and (orientation:portrait){
      .fixed-game .game-top button{padding:6px 7px;font-size:.68rem}
      .fixed-game .question-progress{font-size:.62rem}
      .fixed-game .meta-pill{font-size:.58rem;padding:2px 5px}
      .fixed-game .active-team-banner{font-size:.7rem}
      .fixed-game .question-title{font-size:clamp(1.18rem,3vh,1.58rem)!important;max-height:17vh}
      .fixed-game .answer{font-size:clamp(.95rem,2vh,1.12rem);padding:5px 8px}
      .fixed-game .answer-letter{width:33px;height:33px}
    }
    @media(max-width:700px) and (orientation:landscape){
      .fixed-game .wrap{gap:3px}
      .fixed-game .scoreboard{display:flex;gap:4px}
      .fixed-game .scoreboard .team{display:none}
      .fixed-game .scoreboard .team.active{display:block;flex:1}
      .fixed-game .quiz-card{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);grid-template-rows:auto minmax(0,1fr) auto;align-items:stretch}
      .fixed-game .active-team-banner{grid-column:1/-1}
      .fixed-game .question-block{grid-column:1;grid-row:2}
      .fixed-game .answers{grid-column:2;grid-row:2;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
      .fixed-game .game-actions{grid-column:1/-1}
      .fixed-game .question-title{font-size:clamp(1rem,4vh,1.5rem)!important;max-height:none}
    }

    /* Pergunta maior no modo normal, sem ecrã inteiro */
    body.game-active:not(.browser-fullscreen) .fixed-game .question-block{padding:clamp(10px,1.6vh,18px) clamp(12px,2vw,26px)}
    body.game-active:not(.browser-fullscreen) .fixed-game .question-kicker{font-size:clamp(.78rem,1.35vh,1rem);letter-spacing:.16em}
    body.game-active:not(.browser-fullscreen) .fixed-game .question-title{font-size:clamp(2rem,5.2vh,3.7rem)!important;line-height:1.06;max-height:24vh}
    @media(max-width:700px){body.game-active:not(.browser-fullscreen) .fixed-game .question-title{font-size:clamp(1.45rem,3.7vh,2.15rem)!important;max-height:20vh}}

    /* Botão de ecrã inteiro disponível durante o quiz */
    .game-fullscreen-btn{min-width:44px;min-height:44px;padding:8px 11px;font-size:1.05rem;white-space:nowrap}
    @media(max-width:700px){.game-fullscreen-btn{min-width:42px;min-height:42px;padding:6px 8px;font-size:.88rem}.game-fullscreen-btn .full-label{display:none}}

    /* Quiz Up 2.0 Alpha */
    body[data-theme="neon"]{--v2-primary:#22d3ee;--v2-secondary:#f0abfc;--v2-surface:#111827}
    body[data-theme="minimal"]{--v2-primary:#94a3b8;--v2-secondary:#e2e8f0;--v2-surface:#111827}
    body[data-theme="contrast"]{--v2-primary:#ffea00;--v2-secondary:#00ffff;--v2-surface:#000}
    body{--v2-primary:#e879f9;--v2-secondary:#67e8f9;--v2-surface:#0f172a}
    body[data-theme] .btn{background:linear-gradient(135deg,var(--v2-primary),#7c3aed)}

    /* Hall of Fame */
    .hof-hero{position:relative;overflow:hidden;border:1px solid #fbbf2450;border-radius:22px;padding:22px;background:radial-gradient(circle at 90% 10%,#f59e0b2b,transparent 34%),linear-gradient(135deg,#581c8738,#0f172acc)}

    .hof-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}.hof-podium-card{position:relative;border:1px solid #ffffff1a;border-radius:19px;padding:18px 12px;text-align:center;background:linear-gradient(160deg,#ffffff12,#ffffff05);cursor:pointer}.hof-podium-card.first{min-height:190px;border-color:#fbbf2470;background:linear-gradient(160deg,#f59e0b28,#ffffff08)}.hof-podium-card.second{min-height:165px}.hof-podium-card.third{min-height:150px}.hof-medal{font-size:2rem}.hof-podium-card strong{display:block;margin-top:7px;font-size:1.08rem}.hof-podium-card small{display:block;color:#94a3b8;margin-top:5px}.hof-value{margin-top:8px;color:#fde68a;font-weight:900}
    .hof-record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.hof-record{border:1px solid #ffffff18;border-radius:16px;padding:14px;background:#02061755}.hof-record span{display:block;color:#94a3b8;font-size:.82rem}.hof-record b{display:block;margin:5px 0;font-size:1.08rem}.hof-record strong{color:var(--v2-secondary)}
    .hof-recent{display:grid;gap:8px}.hof-recent-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px;border-bottom:1px solid #ffffff12}.hof-recent-row:last-child{border-bottom:0}.hof-date{color:#94a3b8;font-size:.78rem}

    .season-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.season-controls input{min-width:230px;flex:1}.season-table{display:grid;gap:0}.season-row{display:grid;grid-template-columns:44px minmax(120px,1fr) repeat(5,minmax(65px,auto));gap:9px;align-items:center;padding:11px;border-bottom:1px solid #ffffff12}.season-row.header{color:#94a3b8;font-size:.72rem;font-weight:900;text-transform:uppercase}.season-row b{overflow:hidden;text-overflow:ellipsis}.season-history{display:grid;gap:10px}.season-card{border:1px solid #ffffff18;border-radius:16px;padding:14px;background:#02061755}.season-card summary{cursor:pointer;font-weight:900}.season-champion{color:#fde68a}.season-mvp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin-top:10px}.season-mvp{border:1px solid #ffffff12;border-radius:12px;padding:10px;background:#ffffff07}.season-mvp small{display:block;color:#94a3b8}.season-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.status{white-space:pre-line;line-height:1.45;text-align:left}


/* Quiz Up 3.6 Premium: temas completos e micro-polimento */
body{
 --theme-bg:#070b18;--theme-bg2:#111a36;--theme-panel:rgba(15,23,42,.78);
 --theme-card:rgba(255,255,255,.075);--theme-card-strong:rgba(255,255,255,.11);
 --theme-border:rgba(255,255,255,.14);--theme-text:#f8fafc;--theme-muted:#a8b3c7;
 --theme-primary:#d946ef;--theme-secondary:#22d3ee;--theme-glow:rgba(217,70,239,.28);
 --theme-success:#22c55e;--theme-danger:#ef4444;
 background:
  radial-gradient(circle at 12% 8%,var(--theme-glow),transparent 31%),
  radial-gradient(circle at 88% 6%,color-mix(in srgb,var(--theme-secondary) 20%,transparent),transparent 30%),
  linear-gradient(145deg,var(--theme-bg),var(--theme-bg2)) fixed!important;
 color:var(--theme-text);transition:background .45s ease,color .3s ease;
}
body[data-theme="quizup"]{--theme-bg:#070b18;--theme-bg2:#15113a;--theme-primary:#d946ef;--theme-secondary:#22d3ee;--theme-glow:rgba(217,70,239,.27)}
body[data-theme="ocean"]{--theme-bg:#031525;--theme-bg2:#063b55;--theme-primary:#0ea5e9;--theme-secondary:#2dd4bf;--theme-glow:rgba(14,165,233,.30);--theme-panel:rgba(3,40,61,.80)}
body[data-theme="forest"]{--theme-bg:#04150d;--theme-bg2:#123c25;--theme-primary:#22c55e;--theme-secondary:#a3e635;--theme-glow:rgba(34,197,94,.25);--theme-panel:rgba(7,45,27,.80)}
body[data-theme="lava"]{--theme-bg:#1d0705;--theme-bg2:#5a160d;--theme-primary:#f97316;--theme-secondary:#facc15;--theme-glow:rgba(249,115,22,.30);--theme-panel:rgba(67,17,10,.82)}
body[data-theme="neon"]{--theme-bg:#08051b;--theme-bg2:#25104c;--theme-primary:#22d3ee;--theme-secondary:#f0abfc;--theme-glow:rgba(34,211,238,.30);--theme-panel:rgba(21,12,54,.82)}
body[data-theme="gold"]{--theme-bg:#0b0b0c;--theme-bg2:#2d2411;--theme-primary:#fbbf24;--theme-secondary:#fde68a;--theme-glow:rgba(251,191,36,.25);--theme-panel:rgba(29,25,17,.84)}
body[data-theme="neon"] .card,body[data-theme="neon"] .quiz-card{box-shadow:0 0 0 1px rgba(34,211,238,.18),0 25px 70px rgba(0,0,0,.42),0 0 35px rgba(240,171,252,.09)}
body[data-theme="gold"] h1,body[data-theme="gold"] .question-kicker{color:#fde68a;text-shadow:0 0 22px rgba(251,191,36,.18)}
body[data-theme] main{position:relative;isolation:isolate}
body[data-theme] main:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
body[data-theme] .card,body[data-theme] .panel,body[data-theme] .quiz-card,body[data-theme] .summary-card,body[data-theme] .failed-item,body[data-theme] .team,body[data-theme] .cat{background:linear-gradient(145deg,var(--theme-card-strong),var(--theme-card));border-color:var(--theme-border);box-shadow:0 22px 60px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%)}
body[data-theme] .card{border-radius:28px} body[data-theme] .panel{border-radius:20px}
body[data-theme] .muted{color:var(--theme-muted)} body[data-theme] .cyan{color:var(--theme-secondary)} body[data-theme] .amber{color:var(--theme-secondary)}
body[data-theme] button,body[data-theme] input,body[data-theme] select,body[data-theme] textarea{border-color:var(--theme-border);background:color-mix(in srgb,var(--theme-panel) 82%,transparent);color:var(--theme-text)}
body[data-theme] .btn{background:linear-gradient(135deg,var(--theme-primary),color-mix(in srgb,var(--theme-primary) 55%,var(--theme-secondary)));box-shadow:0 12px 28px color-mix(in srgb,var(--theme-primary) 32%,transparent);color:#fff}
body[data-theme="gold"] .btn,body[data-theme="lava"] .btn{color:#171717}
body[data-theme] button{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
body[data-theme] button:hover:not(:disabled){transform:translateY(-2px);border-color:color-mix(in srgb,var(--theme-primary) 58%,white 8%)}
body[data-theme] button:active:not(:disabled){transform:translateY(0) scale(.98)}
body[data-theme] .answer{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--theme-panel) 90%,transparent),color-mix(in srgb,var(--theme-primary) 7%,transparent));border-color:var(--theme-border);box-shadow:0 8px 24px rgba(0,0,0,.16);transition:transform .18s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}
body[data-theme] .answer:hover:not(:disabled){transform:translateY(-3px);border-color:color-mix(in srgb,var(--theme-primary) 60%,white 10%);box-shadow:0 14px 32px color-mix(in srgb,var(--theme-primary) 18%,rgba(0,0,0,.24))}

body[data-theme] .meta-pill,body[data-theme] .study-pill,body[data-theme] .v2-badge{border-color:color-mix(in srgb,var(--theme-primary) 40%,transparent);background:color-mix(in srgb,var(--theme-primary) 11%,transparent);color:color-mix(in srgb,var(--theme-secondary) 75%,white)}

function bindSideNav(){document.querySelectorAll('.app-sidebar [data-a]').forEach(e=>e.onclick=()=>{const a=e.dataset.a;if(a==='conqueror'){state.screen='conqueror';}if(a==='home')state.screen='home';if(a==='stats')state.screen='stats';if(a==='hall')state.screen='hall';if(a==='achievements')state.screen='achievements';if(a==='profiles')state.screen='profiles';if(a==='sidebar')state.sidebar=true;render()});document.querySelectorAll('.app-sidebar [data-f]').forEach(e=>e.onchange=()=>{state[e.dataset.f]=e.value;saveV2Settings();render()})}
function render(){clearTimeout(timer);clearTimeout(autoTimer);document.body.classList.toggle('game-active',state.screen==='game');document.body.dataset.theme=state.theme;if(state.screen==='home')home();else if(state.screen==='conqueror')conqueror();else if(state.screen==='results')results();else if(state.screen==='stats')v2Stats();else if(state.screen==='hall')v2Hall();else if(state.screen==='achievements')v2Achievements();else if(state.screen==='profiles')v2Profiles();else game();mountSideNav()}

function teamCareerData(){if(state.careerCache&&state.careerCacheSize===state.history.length)return state.careerCache;const map={};state.history.forEach(g=>{const top=Math.max(0,...(g.teamResults||[]).map(t=>t.score||0));(g.teamResults||[]).forEach((t,pos)=>{const key=teamKey(t.name),label=teamLabel(t.name),x=map[key]??={key,name:label,aliases:new Set(),games:0,wins:0,podiums:0,points:0,right:0,total:0,bestScore:0,bestStreak:0,timeWeighted:0,evolution:[],packs:{},firstDate:g.date,lastDate:g.date,categories:{}};x.aliases.add(label);x.games++;x.wins+=t.score===top?1:0;x.podiums+=pos<3?1:0;x.points+=t.score||0;x.right+=t.right||0;x.total+=t.total||0;x.bestScore=Math.max(x.bestScore,t.score||0);x.bestStreak=Math.max(x.bestStreak,t.bestStreak||0);x.timeWeighted+=(t.avgTime||0)*(t.total||0);x.evolution.push({date:g.date,score:t.score||0,accuracy:t.accuracy||0});if(String(g.date)<String(x.firstDate))x.firstDate=g.date;if(String(g.date)>String(x.lastDate))x.lastDate=g.date;(g.attempts||[]).filter(a=>teamKey(g.teams?.[a.teamIndex])===key).forEach(a=>{const p=a.packId||'core-pt';x.packs[p]??={total:0,right:0,points:0};x.packs[p].total++;x.packs[p].right+=a.correct?1:0;x.packs[p].points+=a.points||0;const c=a.category||'Outro';x.categories[c]??={total:0,right:0};x.categories[c].total++;x.categories[c].right+=a.correct?1:0})})});Object.values(map).forEach(x=>{x.accuracy=x.total?Math.round(x.right/x.total*100):0;x.avgPoints=x.games?Math.round(x.points/x.games*10)/10:0;x.avgTime=x.total?Math.round(x.timeWeighted/x.total*10)/10:0;const qualified=Object.entries(x.categories).filter(([,d])=>d.total>=3).map(([name,d])=>({name,total:d.total,accuracy:Math.round(d.right/d.total*100)})).sort((a,b)=>b.accuracy-a.accuracy||b.total-a.total);x.bestCategory=qualified[0]||null;x.improveCategory=qualified.length>1?qualified[qualified.length-1]:null;x.aliases=[...x.aliases]});state.careerCache=map;state.careerCacheSize=state.history.length;return map}

  const rank=state.teams.map((team,teamIndex)=>({team,teamIndex,score:state.scores[teamIndex]||0,stats:teamStats(teamIndex)})).sort((a,b)=>b.score-a.score);
  app.innerHTML=`<main><div class="results-wrap"><div style="text-align:center"><div class="amber" style="font-size:64px">🏆</div><h1>Classificação e estatísticas</h1></div>${state.newAchievements.length?`<div class="achievement-alert">🎖️ Nova${state.newAchievements.length>1?'s':''} conquista${state.newAchievements.length>1?'s':''}: ${state.newAchievements.map(esc).join(' · ')}</div>`:''}${rank.map((entry,position)=>{const st=entry.stats,failedOpen=Boolean(state.showFailed[entry.teamIndex]);return `<section class="card team-stats"><div class="row between"><h2 style="margin:0">${position+1}. ${esc(entry.team)}</h2><b>${entry.score} pts</b></div><div class="summary-grid" style="margin-top:14px"><div class="summary-card"><b>${st.items.length}</b><span class="muted">Perguntas</span></div><div class="summary-card"><b>${st.right}</b><span class="muted">Certas</span></div><div class="summary-card"><b>${st.wrong}</b><span class="muted">Erradas</span></div><div class="summary-card"><b>${st.percent}%</b><span class="muted">Acerto</span></div><div class="summary-card"><b>${st.points}</b><span class="muted">Pontos</span></div></div><div class="panel" style="margin-top:14px"><h3>Desempenho por categoria</h3>${Object.keys(st.categories).length?Object.entries(st.categories).map(([category,data])=>`<div class="category-row"><b>${esc(category)}</b><span style="color:#6ee7b7">✓ ${data.right}</span><span style="color:#fca5a5">✕ ${data.wrong}</span></div>`).join(''):'<p class="muted">Sem respostas registadas.</p>'}</div><div style="margin-top:14px"><button class="outline" data-failed="${entry.teamIndex}">${failedOpen?'Ocultar perguntas falhadas':`Ver perguntas falhadas (${st.failed.length})`}</button>${failedOpen?`<div class="failed-list" style="margin-top:12px">${st.failed.length?st.failed.map(item=>`<article class="failed-item"><b>${esc(item.question)}</b><p class="muted">${esc(item.category)}</p><p><span class="muted">Resposta escolhida:</span> ${esc(item.selected)}</p><p><span class="muted">Resposta correta:</span> <strong style="color:#6ee7b7">${esc(item.correctAnswer)}</strong></p></article>`).join(''):'<p class="status">Não houve perguntas falhadas.</p>'}</div>`:''}</div></section>`}).join('')}<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-a="start">↻ Nova partida</button><button class="outline" data-a="home">Definições</button></div></div></main>`;bind()}
function addQuestionFromForm(){
  const question=document.getElementById('new-question')?.value.trim()||'';
  const category=document.getElementById('new-category')?.value||'Cultura Geral';
  const difficulty=document.getElementById('new-difficulty')?.value||'Médio';
  const options=[0,1,2,3].map(i=>document.getElementById(`new-option-${i}`)?.value.trim()||'');
  const answer=Number(document.getElementById('new-answer')?.value||0);
  const explanation=document.getElementById('new-explanation')?.value.trim()||'';
  if(!question||options.some(v=>!v)){state.status='Preenche a pergunta e as quatro respostas.';return false}
  if(new Set(options.map(v=>v.toLocaleLowerCase('pt'))).size!==4){state.status='As quatro respostas têm de ser diferentes.';return false}
  if(state.bank.some(q=>q.question.trim().toLocaleLowerCase('pt')===question.toLocaleLowerCase('pt'))){state.status='Esta pergunta já existe no banco.';return false}
  const id=`custom-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  state.bank=[...state.bank,{id,category,difficulty,question,options,answer,explanation}];
  saveBank();
  state.status=`Pergunta adicionada. O banco tem agora ${state.bank.length} perguntas.`;
  return true
}

function validate(data){if(!Array.isArray(data)||!data.length)throw Error('O ficheiro deve conter uma lista de perguntas.');const ids=new Set,questions=new Set;return data.map((x,i)=>{const options=Array.isArray(x.options)?x.options.map(v=>String(v).trim()).filter(Boolean):[],answer=Number(x.answer),id=String(x.id||`imported-${Date.now()}-${i+1}`),question=String(x.question||'').trim(),questionKey=question.toLocaleLowerCase('pt');if(!question||!x.category||options.length<2||new Set(options.map(v=>v.toLocaleLowerCase('pt'))).size!==options.length||!Number.isInteger(answer)||answer<0||answer>=options.length)throw Error(`Pergunta ${i+1} inválida ou com opções repetidas.`);if(ids.has(id))throw Error(`ID duplicado: ${id}`);if(questions.has(questionKey))throw Error(`Pergunta repetida: ${question}`);ids.add(id);questions.add(questionKey);return{id,category:String(x.category),difficulty:['Fácil','Médio','Difícil'].includes(x.difficulty)?x.difficulty:'Médio',question,options,answer,explanation:String(x.explanation||'')}})}
function bind(){document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{let a=e.dataset.a;if(a==='sidebar')state.sidebar=true;if(a==='close')state.sidebar=false;if(a==='addteam'&&state.teams.length<8)state.teams.push(`Equipa ${state.teams.length+1}`);if(a==='allcats')state.cats=[...CLASSIC];if(a==='nocats')state.cats=[];if(a==='clear'){state.used=[];state.games=0;localStorage.removeItem(STORAGE.used);localStorage.removeItem(STORAGE.games)}if(a==='start')start();if(a==='full')toggleFullscreen();if(a==='finish'){if(state.screen==='game'&&!state.revealed)recordCurrent();state.screen='results'}if(a==='pause')state.paused=!state.paused;if(a==='reveal')reveal();if(a==='next')next();if(a==='home')state.screen='home';if(a==='stats')state.screen='stats';if(a==='hall')state.screen='hall';if(a==='achievements')state.screen='achievements';if(a==='profiles')state.screen='profiles';if(a==='saveseasonname')saveActiveSeasonName();if(a==='closeseason')closeActiveSeason();if(a==='clearhall'&&confirm('Limpar todos os recordes do Hall of Fame?')){state.hall=[];localStorage.removeItem(STORAGE.hall)}if(a==='clearstats'&&confirm('Limpar todo o histórico e as estatísticas?')){state.history=[];state.hall=[];localStorage.removeItem(STORAGE.history);localStorage.removeItem(STORAGE.hall);localStorage.removeItem('quizUpV2Achievements');invalidateCareerCache()}if(a==='exportstats')exportStats();if(a==='savequestion'){addQuestionFromForm()}if(a==='restore'&&confirm('Eliminar todas as perguntas personalizadas e repor o banco original?')){state.bank=DEFAULT_BANK;localStorage.removeItem(STORAGE.bank);state.used=[];localStorage.removeItem(STORAGE.used);state.status=`Banco integrado de ${DEFAULT_BANK.length} perguntas únicas restaurado.`}render()});document.querySelector('#stats-import')?.addEventListener('change',e=>{const file=e.target.files?.[0];if(file)importStats(file)});document.querySelectorAll('[data-delete-game]').forEach(e=>e.onclick=()=>deleteHistoryGame(e.dataset.deleteGame));document.querySelectorAll('[data-profile]').forEach(e=>e.onclick=()=>{state.profileTeam=e.dataset.profile;state.screen='profiles';render()});document.querySelectorAll('[data-rank]').forEach(e=>e.onclick=()=>{state.rankingMetric=e.dataset.rank;render()});document.querySelectorAll('[data-team]').forEach(e=>e.oninput=()=>state.teams[+e.dataset.team]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.teams.splice(+e.dataset.remove,1);render()});document.querySelectorAll('[data-cat]').forEach(e=>e.onchange=()=>{state.cats=e.checked?[...state.cats,e.dataset.cat]:state.cats.filter(x=>x!==e.dataset.cat);render()});document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{let k=e.dataset.f;state[k]=e.type==='checkbox'?e.checked:(['count','seconds'].includes(k)?+e.value:e.value);if(['roundType','singleCategory','language','theme'].includes(k))saveV2Settings();render()});document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>{state.selected=+e.dataset.opt;render()});document.querySelector('#pack-import')?.addEventListener('change',e=>{const file=e.target.files?.[0];if(file)importPack(file)});document.querySelectorAll('[data-pack-toggle]').forEach(e=>e.onclick=()=>togglePack(+e.dataset.packToggle));document.querySelectorAll('[data-pack-export]').forEach(e=>e.onclick=()=>exportPack(+e.dataset.packExport));document.querySelectorAll('[data-pack-copy]').forEach(e=>e.onclick=()=>duplicatePack(+e.dataset.packCopy));document.querySelectorAll('[data-pack-remove]').forEach(e=>e.onclick=()=>{state.packs.splice(+e.dataset.packRemove,1);localStorage.setItem(STORAGE.packs,JSON.stringify(state.packs));rebuildPackBank();render()});document.querySelectorAll('[data-failed]').forEach(e=>e.onclick=async()=>{const id=+e.dataset.failed,opening=!state.showFailed[id];if(opening&&document.fullscreenElement){try{await document.exitFullscreen()}catch{}}state.showFailed[id]=opening;render();if(opening)requestAnimationFrame(()=>document.querySelector(`[data-failed=\"${id}\"]`)?.scrollIntoView({behavior:'smooth',block:'start'}))});}


async function toggleFullscreen(){
  window.scrollTo(0,0);
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch{}
  requestAnimationFrame(()=>{
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
  });
}
function keyboardControl(event){
  if(state.screen!=='game'||state.paused)return;
  const target=event.target;
  if(target&&(['INPUT','SELECT','TEXTAREA'].includes(target.tagName)||target.isContentEditable))return;
  if(state.auto&&!state.manual)return;
  const question=state.game[state.index];
  if(!question)return;
  const key=event.key.toLowerCase();
  const letterIndex={a:0,b:1,c:2,d:3}[key];
  if(letterIndex!==undefined&&letterIndex<question.options.length&&!state.revealed){
    event.preventDefault();
    state.selected=letterIndex;
    render();
    return;
  }
  if((event.key==='ArrowLeft'||event.key==='ArrowRight')&&!state.revealed){
    event.preventDefault();
    const direction=event.key==='ArrowRight'?1:-1;
    const current=state.selected===null?(direction>0?-1:0):state.selected;
    state.selected=(current+direction+question.options.length)%question.options.length;
    render();
    return;
  }
  if(event.code==='Space'){
    event.preventDefault();
    if(event.repeat)return;
    if(state.revealed){next();return}
    if(state.selected!==null)reveal();
  }
}
document.addEventListener('keydown',keyboardControl);
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('browser-fullscreen',Boolean(document.fullscreenElement));if(state.screen==='game')render();else requestAnimationFrame(()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0})});
function updateViewportHeight(){const height=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--vh',`${height*.01}px`)}
state.bank=[...DEFAULT_BANK,...state.packs.flatMap(p=>p.questions)];
updateViewportHeight();
window.addEventListener('resize',updateViewportHeight,{passive:true});
window.visualViewport?.addEventListener('resize',updateViewportHeight,{passive:true});
render();
</script>

<script>
// Quiz Up 3.2: estudo por recuperação, espaçamento e autoavaliação de todas as perguntas.
const STUDY_KEY='quizUpV32StudyRecords';
state.studyRecords=stored(STUDY_KEY,{});state.studyGrade=null;
function isStudy(){return state.roundType==='study';}
function studyEntry(id){return state.studyRecords[id]||{seen:0,correct:0,wrong:0,stage:0,dueAt:0,lastSeen:0,lastGrade:null};}
function saveStudy(){localStorage.setItem(STUDY_KEY,JSON.stringify(state.studyRecords));}
function reviewWeight(q){const r=studyEntry(q.id),now=Date.now();if(!r.seen)return 100000+Math.random()*500;let w=r.dueAt<=now?15000:0;w+=Math.max(0,3000-(now-r.lastSeen)/3600000);return w+Math.random()*250;}
function studySelection(pool,count){return [...pool].sort((a,b)=>reviewWeight(b)-reviewWeight(a)).slice(0,count);}
function initialStudyRecord(q,correct){const r=studyEntry(q.id),now=Date.now();r.seen++;r.lastSeen=now;if(correct)r.correct++;else r.wrong++;r.stage=Math.max(0,r.stage);r.dueAt=now+86400000;state.studyRecords[q.id]=r;saveStudy();}
function gradeStudy(q,grade){const r=studyEntry(q.id),now=Date.now(),days={again:1,hard:3,good:7,easy:14};r.lastGrade=grade;r.stage=grade==='again'?0:grade==='hard'?Math.max(1,r.stage):grade==='good'?Math.max(2,r.stage+1):Math.max(3,r.stage+2);r.dueAt=now+days[grade]*86400000;state.studyRecords[q.id]=r;state.studyGrade=grade;saveStudy();game();bind();}
const baseStart=start;
start=function(){baseStart();if(state.screen!=='game')return;if(isStudy()){const pool=filtered();state.game=studySelection(pool,state.game.length);state.time=0;state.seconds=0;state.auto=false;state.manual=true;}state.studyGrade=null;render();};
const baseRecordCurrent=recordCurrent;
recordCurrent=function(){const q=state.game[state.index],already=state.attempts.some(a=>a.index===state.index);baseRecordCurrent();if(!already&&q&&isStudy())initialStudyRecord(q,state.selected===q.answer);};
const baseNext=next;
next=function(){state.studyGrade=null;baseNext();};
const baseGame=game;
game=function(){baseGame();if(state.screen!=='game'||!isStudy())return;const q=state.game[state.index],top=document.querySelector('.question-meta');if(top)top.insertAdjacentHTML('beforeend','<span class="study-pill">📚 Estudo</span>');if(state.revealed){const actions=document.querySelector('.game-actions');if(actions){const labels={again:'Rever cedo',hard:'Custou',good:'Sabia',easy:'Muito fácil'};const wrap=document.createElement('div');wrap.innerHTML='<div class="study-grade">'+Object.entries(labels).map(([k,v])=>'<button type="button" class="'+(state.studyGrade===k?'on':'')+'" data-study-grade="'+k+'">'+v+'</button>').join('')+'</div><div class="study-note">Classifica a recordação. Esta avaliação agenda a próxima revisão desta pergunta.</div>';actions.before(wrap);wrap.querySelectorAll('[data-study-grade]').forEach(b=>b.onclick=()=>gradeStudy(q,b.dataset.studyGrade));}}};
</script>
