const OPTION_POOLS={

function questionKind(c,s,a){
  if(c==='Geografia')return'capital';
  if(c==='História')return /^\\d{4}$/.test(a)?'year':'ruler';
  if(c==='Portugal'){if(['Coimbra','Porto','Lisboa'].includes(s))return'river';if(s.includes('autor')||s.includes('Nobel'))return'author';return'date'}
  if(c==='Literatura')return'author';if(c==='Cinema e TV')return'director';if(c==='Arte')return'artist';if(c==='Música')return'musician';
  if(c==='Ciência'){if(['ouro','prata','ferro','sódio'].includes(s))return'symbol';if(s.includes('planeta'))return'planet';if(s.includes('unidade'))return'unit';return'number'}
  if(c==='Natureza'){if(s.includes('mamífero')||s.includes('animal'))return'animal';if(s.includes('oceano'))return'ocean';if(s.includes('floresta'))return'forest';return'tree'}
  if(c==='Desporto')return'sport';if(c==='Gastronomia')return'ingredient';if(c==='Tecnologia')return'company';
  if(c==='Cultura Geral'){if(s.includes('moeda'))return'currency';if(s.includes('mistura'))return'color';if(s.includes('instrumento'))return'instrument';return'number'}

}
function qtext(c,s,a){
  if(c==='Geografia')return `Qual é a capital de ${s}?`;
  if(c==='História')return /^\\d{4}$/.test(a)?`Em que ano ocorreu: ${s}?`:`Quem foi o ${s}?`;

  if(c==='Literatura')return `Quem escreveu ${s}?`;if(c==='Cinema e TV')return `Quem realizou ${s}?`;if(c==='Arte')return `Quem criou ${s}?`;if(c==='Música')return `Quem lançou ${s}?`;
  if(c==='Ciência'){if(['ouro','prata','ferro','sódio'].includes(s))return `Qual é o símbolo químico de ${s}?`;if(s.includes('maior planeta'))return 'Qual é o maior planeta do Sistema Solar?';if(s.includes('mais próximo'))return 'Qual é o planeta mais próximo do Sol?';if(s.includes('unidade SI'))return 'Qual é a unidade SI de força?';return 'Quantos cromossomas tem normalmente uma célula humana?'}

  return `Qual é o resultado de: ${s}?`;
}
function makeBank(){
  const seen=new Set();
  return FACTS.map(([category,subject,correct],i)=>{
    const kind=questionKind(category,subject,correct),question=qtext(category,subject,correct),key=question.trim().toLocaleLowerCase('pt');
    if(seen.has(key))return null;seen.add(key);
    const pool=[...new Set((OPTION_POOLS[kind]||[]).filter(v=>v!==correct))];
    const start=i%Math.max(1,pool.length),wrong=[];
    for(let n=0;n<pool.length&&wrong.length<3;n++){const value=pool[(start+n)%pool.length];if(value&&!wrong.includes(value))wrong.push(value)}
    const options=[correct,...wrong],rotation=i%options.length,rotated=options.map((_,j)=>options[(j+rotation)%options.length]);
    return{id:`local-${i+1}`,category,difficulty:i%5<2?'Fácil':i%5<4?'Médio':'Difícil',question,options:rotated,answer:rotated.indexOf(correct),explanation:`Resposta correta: ${correct}.`};
  }).filter(Boolean);

function saveBank(){localStorage.setItem(STORAGE.bank,JSON.stringify(state.bank))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filtered(){return state.bank.filter(q=>(state.difficulty==='Misto'||q.difficulty===state.difficulty)&&state.cats.includes(classic(q.category)))}
function counts(){let r={};CLASSIC.forEach(c=>r[c]=state.bank.filter(q=>(state.difficulty==='Misto'||q.difficulty===state.difficulty)&&classic(q.category)===c).length);return r}
function render(){clearTimeout(timer);clearTimeout(autoTimer);document.body.classList.toggle('game-active',state.screen==='game');if(state.screen==='home')home();else if(state.screen==='results')results();else game();}
function home(){const fs=filtered(),cc=counts(),ids=new Set(fs.map(x=>x.id)),used=state.used.filter(x=>ids.has(x)).length;app.innerHTML=`<main><div class="wrap"><div class="card space"><div class="titlebar"><button class="outline bankbtn" data-a="sidebar">Banco JSON</button><div class="amber" style="font-size:54px">🏆</div><h1>Quiz de Bar</h1><p class="muted">Banco integrado: ${state.bank.length} perguntas únicas.</p></div><section><div class="row between"><b>${state.teams.length===1?'Jogador':'Equipas'} (${state.teams.length}/8)</b><button class="outline" data-a="addteam">+ Adicionar equipa</button></div><div class="grid g2" style="margin-top:12px">${state.teams.map((t,i)=>`<div class="row"><input style="flex:1" value="${esc(t)}" data-team="${i}">${state.teams.length>1?`<button class="ghost" data-remove="${i}">×</button>`:''}</div>`).join('')}</div></section><div class="grid g3"><label>Perguntas<select data-f="count">${COUNTS.map(v=>`<option ${v===state.count?'selected':''}>${v}</option>`).join('')}</select></label><label>Dificuldade<select data-f="difficulty">${['Misto','Fácil','Médio','Difícil'].map(v=>`<option ${v===state.difficulty?'selected':''}>${v}</option>`).join('')}</select></label><label>Tempo<select data-f="seconds">${[15,20,30,45,60].map(v=>`<option value="${v}" ${v===state.seconds?'selected':''}>${v} segundos</option>`).join('')}</select></label></div><section class="panel"><div class="row between"><div><b>Bar Clássico (${state.cats.length}/5)</b><div class="muted">${fs.length} perguntas disponíveis</div></div><div class="row"><button class="ghost" data-a="allcats">Todas</button><button class="ghost" data-a="nocats">Limpar</button></div></div><div class="grid g3" style="margin-top:12px">${CLASSIC.map(c=>`<label class="cat ${state.cats.includes(c)?'on':''}"><span><input type="checkbox" data-cat="${esc(c)}" ${state.cats.includes(c)?'checked':''}> ${esc(c)}</span><b>${cc[c]}</b></label>`).join('')}</div></section><div class="panel grid g4"><div class="stat"><b>${fs.length}</b><span class="muted">Total filtrado</span></div><div class="stat"><b>${used}</b><span class="muted">Usadas</span></div><div class="stat"><b>${Math.max(0,fs.length-used)}</b><span class="muted">Disponíveis</span></div><div class="stat"><b>${state.games}</b><span class="muted">Partidas</span></div><button class="ghost" data-a="clear">Limpar histórico</button></div><div class="panel"><label><input type="checkbox" data-f="auto" ${state.auto?'checked':''}> Modo automático</label>${state.auto?`<label style="margin-left:18px"><input type="checkbox" data-f="manual" ${state.manual?'checked':''}> Permitir avanço manual</label>`:''}</div><div class="row"><button class="btn" style="flex:1" data-a="start" ${fs.length?'':'disabled'}>▶ Iniciar</button><button class="outline" data-a="full">⛶ Ecrã inteiro</button></div></div></div></main>${state.sidebar?sidebar():''}`;bind()}
function sidebar(){return `<button class="overlay" data-a="close"></button><aside class="sidebar"><div class="row between"><div><h2>Banco de perguntas</h2><p class="muted">${state.bank.length} perguntas ativas</p></div><button class="ghost close" data-a="close">×</button></div><div class="grid" style="margin-top:28px"><button class="btn" data-a="export">Exportar JSON</button><label class="outline" style="text-align:center;cursor:pointer">Importar JSON<input id="import" class="hidden" type="file" accept=".json,application/json"></label><button class="outline" data-a="restore">Repor banco integrado</button></div>${state.status?`<p class="status" style="margin-top:18px">${esc(state.status)}</p>`:''}<div class="panel muted" style="margin-top:26px"><b style="color:white">Formato aceite</b><p>Lista JSON com: id, category, difficulty, question, options, answer e explanation.</p></div></aside>`}
function start(){let fs=filtered();if(!fs.length)return;let avail=fs.filter(q=>!state.used.includes(q.id));if(avail.length<Math.min(state.count,fs.length)){avail=fs;state.used=state.used.filter(id=>!new Set(fs.map(q=>q.id)).has(id))}state.game=shuffle(avail).slice(0,Math.min(state.count,avail.length));state.used=[...new Set([...state.used,...state.game.map(q=>q.id)])];state.games++;localStorage.setItem(STORAGE.used,JSON.stringify(state.used));localStorage.setItem(STORAGE.games,state.games);state.scores=state.teams.map(()=>0);Object.assign(state,{index:0,selected:null,revealed:false,active:0,paused:false,time:state.seconds,screen:'game',attempts:[],showFailed:{}});render()}
function game(){const q=state.game[state.index];if(!q){state.screen='home';return render()}const rank=state.teams.map((t,i)=>({t,i,s:state.scores[i]||0})).sort((a,b)=>b.s-a.s);app.innerHTML=`<main class="fixed-game"><div class="wrap"><div class="row between game-top"><div>Pergunta ${state.index+1} de ${state.game.length}<div class="cyan">${esc(classic(q.category))} · ${esc(q.difficulty)}</div></div><div class="row"><button class="danger" data-a="finish">Sair e ver classificação</button>${state.auto?`<button class="outline" data-a="pause">${state.paused?'▶ Continuar':'⏸ Pausar'}</button>`:''}<b style="font-size:1.6rem">⏱ ${state.time}s</b></div></div><div class="grid g4 scoreboard">${rank.map((x,p)=>`<div class="team ${x.i===state.active?'active':''}"><div class="row between"><b>${p===0?'🏆 ':''}${esc(x.t)}</b><b>${x.s}</b></div><small>${x.i===state.active?'▶ Equipa ativa':`${x.s} pts`}</small></div>`).join('')}</div><div class="card quiz-card"><div class="panel" style="color:#f5d0fe">▶ A responder: ${esc(state.teams[state.active])}</div><h2 class="question-title">${esc(q.question)}</h2><div class="answers">${q.options.map((o,i)=>`<button class="answer ${state.revealed&&i===q.answer?'correct':state.revealed&&i===state.selected?'wrong':state.selected===i?'selected':''}" data-opt="${i}" ${(state.revealed||(state.auto&&!state.manual))?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${state.revealed?`<p class="status">${esc(q.explanation||'')}</p>`:''}<div class="row game-actions" style="justify-content:flex-end">${!state.revealed?`<button class="btn" data-a="reveal" ${state.selected===null?'disabled':''}>${state.auto?'Revelar já':'Revelar'}</button>`:`<button class="btn" data-a="next">${state.index===state.game.length-1?'Classificação':state.auto?'Avançar agora':'Próxima'}</button>`}</div></div></div></main>`;bind();if(!state.revealed&&!state.paused&&state.time>0)timer=setTimeout(()=>{state.time--;if(state.time===0)reveal();else render()},1000);if(state.auto&&state.revealed&&!state.paused)autoTimer=setTimeout(next,8000)}
function recordCurrent(){if(state.attempts.some(a=>a.index===state.index))return;const q=state.game[state.index],correct=state.selected===q.answer,points=correct?(POINTS[q.difficulty]||1):0;if(correct)state.scores[state.active]+=points;state.attempts.push({index:state.index,teamIndex:state.active,question:q.question,category:classic(q.category),selected:state.selected===null?'Sem resposta':q.options[state.selected],correctAnswer:q.options[q.answer],correct,points});}
function reveal(){if(state.revealed)return;state.revealed=true;recordCurrent();render()}function next(){if(state.index>=state.game.length-1){state.screen='results';return render()}state.index++;state.active=state.teams.length===1?0:(state.active+1)%state.teams.length;state.selected=null;state.revealed=false;state.time=state.seconds;render()}
function teamStats(teamIndex){const items=state.attempts.filter(a=>a.teamIndex===teamIndex),right=items.filter(a=>a.correct).length,wrong=items.length-right,percent=items.length?Math.round(right/items.length*100):0,points=items.reduce((sum,a)=>sum+a.points,0),categories={};items.forEach(a=>{categories[a.category]??={right:0,wrong:0};categories[a.category][a.correct?'right':'wrong']++});return{items,right,wrong,percent,points,categories,failed:items.filter(a=>!a.correct)}}
function results(){
  const rank=state.teams.map((team,teamIndex)=>({team,teamIndex,score:state.scores[teamIndex]||0,stats:teamStats(teamIndex)})).sort((a,b)=>b.score-a.score);
  app.innerHTML=`<main><div class="results-wrap"><div style="text-align:center"><div class="amber" style="font-size:64px">🏆</div><h1>Classificação e estatísticas</h1></div>${rank.map((entry,position)=>{const st=entry.stats,failedOpen=Boolean(state.showFailed[entry.teamIndex]);return `<section class="card team-stats"><div class="row between"><h2 style="margin:0">${position+1}. ${esc(entry.team)}</h2><b>${entry.score} pts</b></div><div class="summary-grid" style="margin-top:14px"><div class="summary-card"><b>${st.items.length}</b><span class="muted">Perguntas</span></div><div class="summary-card"><b>${st.right}</b><span class="muted">Certas</span></div><div class="summary-card"><b>${st.wrong}</b><span class="muted">Erradas</span></div><div class="summary-card"><b>${st.percent}%</b><span class="muted">Acerto</span></div><div class="summary-card"><b>${st.points}</b><span class="muted">Pontos</span></div></div><div class="panel" style="margin-top:14px"><h3>Desempenho por categoria</h3>${Object.keys(st.categories).length?Object.entries(st.categories).map(([category,data])=>`<div class="category-row"><b>${esc(category)}</b><span style="color:#6ee7b7">✓ ${data.right}</span><span style="color:#fca5a5">✕ ${data.wrong}</span></div>`).join(''):'<p class="muted">Sem respostas registadas.</p>'}</div><div style="margin-top:14px"><button class="outline" data-failed="${entry.teamIndex}">${failedOpen?'Ocultar perguntas falhadas':`Ver perguntas falhadas (${st.failed.length})`}</button>${failedOpen?`<div class="failed-list" style="margin-top:12px">${st.failed.length?st.failed.map(item=>`<article class="failed-item"><b>${esc(item.question)}</b><p class="muted">${esc(item.category)}</p><p><span class="muted">Resposta escolhida:</span> ${esc(item.selected)}</p><p><span class="muted">Resposta correta:</span> <strong style="color:#6ee7b7">${esc(item.correctAnswer)}</strong></p></article>`).join(''):'<p class="status">Não houve perguntas falhadas.</p>'}</div>`:''}</div></section>`}).join('')}<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-a="start">↻ Nova partida</button><button class="outline" data-a="home">Definições</button></div></div></main>`;bind()}
function exportBank(){let b=new Blob([JSON.stringify(state.bank,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`quiz-de-bar-${state.bank.length}-perguntas.json`;a.click();URL.revokeObjectURL(u);state.status=`${state.bank.length} perguntas exportadas.`;render()}
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('O ficheiro deve conter uma lista de perguntas.');const ids=new Set,questions=new Set;return data.map((x,i)=>{const options=Array.isArray(x.options)?x.options.map(v=>String(v).trim()).filter(Boolean):[],answer=Number(x.answer),id=String(x.id||`imported-${Date.now()}-${i+1}`),question=String(x.question||'').trim(),questionKey=question.toLocaleLowerCase('pt');if(!question||!x.category||options.length<2||new Set(options.map(v=>v.toLocaleLowerCase('pt'))).size!==options.length||!Number.isInteger(answer)||answer<0||answer>=options.length)throw Error(`Pergunta ${i+1} inválida ou com opções repetidas.`);if(ids.has(id))throw Error(`ID duplicado: ${id}`);if(questions.has(questionKey))throw Error(`Pergunta repetida: ${question}`);ids.add(id);questions.add(questionKey);return{id,category:String(x.category),difficulty:['Fácil','Médio','Difícil'].includes(x.difficulty)?x.difficulty:'Médio',question,options,answer,explanation:String(x.explanation||'')}})}
function bind(){document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{let a=e.dataset.a;if(a==='sidebar')state.sidebar=true;if(a==='close')state.sidebar=false;if(a==='addteam'&&state.teams.length<8)state.teams.push(`Equipa ${state.teams.length+1}`);if(a==='allcats')state.cats=[...CLASSIC];if(a==='nocats')state.cats=[];if(a==='clear'){state.used=[];state.games=0;localStorage.removeItem(STORAGE.used);localStorage.removeItem(STORAGE.games)}if(a==='start')start();if(a==='full')(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());if(a==='finish'){if(state.screen==='game'&&!state.revealed)recordCurrent();state.screen='results'}if(a==='pause')state.paused=!state.paused;if(a==='reveal')reveal();if(a==='next')next();if(a==='home')state.screen='home';if(a==='export')exportBank();if(a==='restore'){state.bank=DEFAULT_BANK;localStorage.removeItem(STORAGE.bank);state.used=[];localStorage.removeItem(STORAGE.used);state.status=`Banco integrado de ${DEFAULT_BANK.length} perguntas únicas restaurado.`}render()});document.querySelectorAll('[data-team]').forEach(e=>e.oninput=()=>state.teams[+e.dataset.team]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.teams.splice(+e.dataset.remove,1);render()});document.querySelectorAll('[data-cat]').forEach(e=>e.onchange=()=>{state.cats=e.checked?[...state.cats,e.dataset.cat]:state.cats.filter(x=>x!==e.dataset.cat);render()});document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{let k=e.dataset.f;state[k]=e.type==='checkbox'?e.checked:(['count','seconds'].includes(k)?+e.value:e.value);render()});document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>{state.selected=+e.dataset.opt;render()});document.querySelectorAll('[data-failed]').forEach(e=>e.onclick=()=>{const id=+e.dataset.failed;state.showFailed[id]=!state.showFailed[id];render()});let imp=document.getElementById('import');if(imp)imp.onchange=async()=>{let f=imp.files[0];if(!f)return;try{state.bank=validate(JSON.parse(await f.text()));saveBank();state.used=[];localStorage.removeItem(STORAGE.used);state.status=`${state.bank.length} perguntas importadas com sucesso.`}catch(err){state.status=err.message||'Falha ao importar.'}render()}}
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('browser-fullscreen',Boolean(document.fullscreenElement));if(state.screen==='game')render();});
render();
</script>
